<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Leyley</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }
        body {
            background-color: #1a1a2e;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        #game {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Dialog Scene */
        #dialog-scene {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #2d132c 0%, #1a1a2e 100%);
        }
        .sprite {
            position: absolute;
            bottom: 180px;
            width: 80px;
            height: 120px;
            border-radius: 8px;
        }
        #sprite-left {
            left: 15%;
            background: linear-gradient(to bottom, #4a9fff 0%, #2563eb 100%);
            border: 3px solid #1d4ed8;
        }
        #sprite-right {
            right: 15%;
            background: linear-gradient(to bottom, #f472b6 0%, #db2777 100%);
            border: 3px solid #be185d;
        }
        .sprite-face {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
        }
        .sprite-eyes {
            position: absolute;
            top: 15px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        .sprite-eye {
            width: 8px;
            height: 8px;
            background: #333;
            border-radius: 50%;
        }
        .sprite-mouth {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 15px;
            height: 6px;
            background: #333;
            border-radius: 0 0 10px 10px;
        }
        .sprite-label {
            position: absolute;
            bottom: -25px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
        }
        #dialog-box {
            position: absolute;
            bottom: 20px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid #4a9fff;
            border-radius: 12px;
            padding: 15px;
            min-height: 120px;
        }
        #dialog-speaker {
            color: #4a9fff;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }
        #dialog-text {
            color: #fff;
            font-size: 16px;
            line-height: 1.4;
        }
        #dialog-continue {
            position: absolute;
            bottom: 10px;
            right: 15px;
            color: #888;
            font-size: 12px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Exploration Scene */
        #exploration-scene {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #2d5a27;
            display: none;
        }
        #world {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .grass-tile {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #3a7d32;
            border: 1px solid #2d5a27;
        }
        #player {
            position: absolute;
            width: 40px;
            height: 60px;
            background: linear-gradient(to bottom, #4a9fff 0%, #2563eb 100%);
            border: 2px solid #1d4ed8;
            border-radius: 6px;
            z-index: 100;
            transition: left 0.05s, top 0.05s;
        }
        #player .sprite-face {
            width: 30px;
            height: 30px;
            top: 8px;
        }
        #player .sprite-eyes {
            top: 8px;
            gap: 8px;
        }
        #player .sprite-eye {
            width: 5px;
            height: 5px;
        }
        #player .sprite-mouth {
            bottom: 6px;
            width: 10px;
            height: 4px;
        }

        /* Virtual Joystick */
        #joystick-area {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            z-index: 200;
        }
        #joystick-knob {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 201;
        }

        /* Scene indicator */
        #scene-label {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            z-index: 300;
        }
    </style>
</head>
<body>
    <div id="game">
        <!-- Dialog Scene -->
        <div id="dialog-scene">
            <div id="sprite-left" class="sprite">
                <div class="sprite-face">
                    <div class="sprite-eyes">
                        <div class="sprite-eye"></div>
                        <div class="sprite-eye"></div>
                    </div>
                    <div class="sprite-mouth"></div>
                </div>
                <div class="sprite-label">Ley</div>
            </div>
            <div id="sprite-right" class="sprite">
                <div class="sprite-face">
                    <div class="sprite-eyes">
                        <div class="sprite-eye"></div>
                        <div class="sprite-eye"></div>
                    </div>
                    <div class="sprite-mouth"></div>
                </div>
                <div class="sprite-label">Mira</div>
            </div>
            <div id="dialog-box">
                <div id="dialog-speaker">Ley</div>
                <div id="dialog-text">Hello there! Welcome to our world.</div>
                <div id="dialog-continue">tap to continue</div>
            </div>
        </div>

        <!-- Exploration Scene -->
        <div id="exploration-scene">
            <div id="world"></div>
            <div id="player">
                <div class="sprite-face">
                    <div class="sprite-eyes">
                        <div class="sprite-eye"></div>
                        <div class="sprite-eye"></div>
                    </div>
                    <div class="sprite-mouth"></div>
                </div>
            </div>
            <div id="joystick-area">
                <div id="joystick-knob"></div>
            </div>
        </div>

        <div id="scene-label"></div>
    </div>

    <script>
        // Game State
        const game = {
            currentScene: 'dialog',
            dialogIndex: 0,
            player: { x: 0, y: 0 },
            joystick: { active: false, dx: 0, dy: 0 }
        };

        // Dialog Data
        const dialogScript = [
            { speaker: 'Ley', text: 'Hello there! Welcome to our world.' },
            { speaker: 'Mira', text: 'Oh, a new visitor! How exciting!' },
            { speaker: 'Ley', text: 'This is just a test scene to make sure everything works.' },
            { speaker: 'Mira', text: 'Once you finish talking to us, you can explore around!' },
            { speaker: 'Ley', text: 'Use the virtual joystick in the corner to move.' },
            { speaker: 'Mira', text: 'Good luck out there! Tap to begin exploring.' }
        ];

        // DOM Elements
        const dialogScene = document.getElementById('dialog-scene');
        const explorationScene = document.getElementById('exploration-scene');
        const dialogSpeaker = document.getElementById('dialog-speaker');
        const dialogText = document.getElementById('dialog-text');
        const player = document.getElementById('player');
        const joystickArea = document.getElementById('joystick-area');
        const joystickKnob = document.getElementById('joystick-knob');
        const world = document.getElementById('world');
        const sceneLabel = document.getElementById('scene-label');

        // Initialize grass tiles
        function initWorld() {
            const cols = Math.ceil(window.innerWidth / 40) + 2;
            const rows = Math.ceil(window.innerHeight / 40) + 2;

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'grass-tile';
                    tile.style.left = (x * 40) + 'px';
                    tile.style.top = (y * 40) + 'px';
                    // Slight color variation
                    const shade = Math.random() * 20 - 10;
                    tile.style.background = `rgb(${58 + shade}, ${125 + shade}, ${50 + shade})`;
                    world.appendChild(tile);
                }
            }

            // Center player
            game.player.x = window.innerWidth / 2 - 20;
            game.player.y = window.innerHeight / 2 - 30;
            updatePlayerPosition();
        }

        function updatePlayerPosition() {
            player.style.left = game.player.x + 'px';
            player.style.top = game.player.y + 'px';
        }

        // Dialog System
        function advanceDialog() {
            game.dialogIndex++;

            if (game.dialogIndex >= dialogScript.length) {
                switchToExploration();
                return;
            }

            const line = dialogScript[game.dialogIndex];
            dialogSpeaker.textContent = line.speaker;
            dialogText.textContent = line.text;

            // Update speaker color
            dialogSpeaker.style.color = line.speaker === 'Ley' ? '#4a9fff' : '#f472b6';
        }

        function switchToExploration() {
            game.currentScene = 'exploration';
            dialogScene.style.display = 'none';
            explorationScene.style.display = 'block';
            sceneLabel.textContent = 'Exploration Mode';
            initWorld();
        }

        // Joystick Controls
        function handleJoystickStart(e) {
            e.preventDefault();
            game.joystick.active = true;
            handleJoystickMove(e);
        }

        function handleJoystickMove(e) {
            if (!game.joystick.active) return;
            e.preventDefault();

            const rect = joystickArea.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            let dx = clientX - centerX;
            let dy = clientY - centerY;

            // Limit to joystick radius
            const maxDist = 35;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            // Update knob position
            joystickKnob.style.left = `calc(50% + ${dx}px)`;
            joystickKnob.style.top = `calc(50% + ${dy}px)`;

            // Normalize for movement
            game.joystick.dx = dx / maxDist;
            game.joystick.dy = dy / maxDist;
        }

        function handleJoystickEnd(e) {
            e.preventDefault();
            game.joystick.active = false;
            game.joystick.dx = 0;
            game.joystick.dy = 0;
            joystickKnob.style.left = '50%';
            joystickKnob.style.top = '50%';
        }

        // Game Loop
        function gameLoop() {
            if (game.currentScene === 'exploration' && game.joystick.active) {
                const speed = 5;
                game.player.x += game.joystick.dx * speed;
                game.player.y += game.joystick.dy * speed;

                // Keep player in bounds
                game.player.x = Math.max(0, Math.min(window.innerWidth - 40, game.player.x));
                game.player.y = Math.max(0, Math.min(window.innerHeight - 60, game.player.y));

                updatePlayerPosition();
            }
            requestAnimationFrame(gameLoop);
        }

        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            sceneLabel.textContent = 'Dialog Scene';

            // Dialog tap handler
            dialogScene.addEventListener('click', advanceDialog);
            dialogScene.addEventListener('touchend', (e) => {
                e.preventDefault();
                advanceDialog();
            });

            // Joystick handlers
            joystickArea.addEventListener('touchstart', handleJoystickStart, { passive: false });
            joystickArea.addEventListener('touchmove', handleJoystickMove, { passive: false });
            joystickArea.addEventListener('touchend', handleJoystickEnd, { passive: false });

            // Mouse fallback for testing
            joystickArea.addEventListener('mousedown', handleJoystickStart);
            document.addEventListener('mousemove', handleJoystickMove);
            document.addEventListener('mouseup', handleJoystickEnd);

            // Start game loop
            gameLoop();
        });
    </script>
</body>
</html>

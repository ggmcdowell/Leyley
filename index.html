        // ==================== UTILITY FUNCTIONS ====================
        function randomVariance() {
            return 0.9 + Math.random() * 0.2; // 0.9 to 1.1
        }

        function getElementModifier(attackElement, targetElement) {
            if (!attackElement || attackElement === ELEMENTS.NONE) return 1.0;
            if (!targetElement || targetElement === ELEMENTS.NONE) return 1.0;
            return ELEMENT_CHART[attackElement][targetElement] || 1.0;
        }

        function rollCrit(bonus = 0) {
            return Math.random() < (BASE_CRIT_CHANCE + bonus);
        }

        function getXPForLevel(level) {
            return XP_TABLE[Math.min(level, XP_TABLE.length - 1)] || XP_TABLE[XP_TABLE.length - 1];
        }

        // ==================== DAMAGE FORMULAS ====================
        function calcPhysicalDamage(attacker, defender, weaponMod = 1.0) {
            const baseDamage = (attacker.atk * 2) - defender.def;
            let finalDamage = Math.max(1, Math.floor(baseDamage * weaponMod * randomVariance()));

            const isCrit = rollCrit();
            if (isCrit) {
                finalDamage = Math.floor(finalDamage * CRIT_MULTIPLIER);
            }

            // Apply DEF down debuff
            const defDown = defender.statusEffects?.find(s => s.effect === 'def_down');
            if (defDown) {
                finalDamage = Math.floor(finalDamage * 1.25);
            }

            return { damage: finalDamage, crit: isCrit };
        }

        function calcSkillDamage(attacker, defender, skill) {
            const baseDamage = (attacker.tap * skill.multiplier) - (defender.def * 0.5);
            let finalDamage = Math.max(1, Math.floor(baseDamage * randomVariance()));

            // Elemental modifier
            const elemMod = getElementModifier(skill.element, defender.element);
            finalDamage = Math.floor(finalDamage * elemMod);

            // Crit check - auto crit if target has weakness_revealed
            const hasWeaknessRevealed = attacker.statusEffects?.find(s => s.effect === 'weakness_revealed');
            const isCrit = hasWeaknessRevealed || rollCrit();
            if (isCrit) {
                finalDamage = Math.floor(finalDamage * CRIT_MULTIPLIER);
            }

            // Remove weakness_revealed after use
            if (hasWeaknessRevealed) {
                attacker.statusEffects = attacker.statusEffects.filter(s => s.effect !== 'weakness_revealed');
            }

            return { damage: finalDamage, crit: isCrit, elemMod };
        }

        function calcHeal(caster, skill) {
            return Math.floor(skill.baseHeal + (caster.tap * skill.tapMod));
        }

        // ==================== TURN ORDER ====================
        function calculateInitiative(entity) {
            return entity.spd + Math.floor(Math.random() * 6); // SPD + Random(0-5)
        }

        function buildTurnOrder() {
            const entities = [];

            // Add alive party members
            game.party.forEach(char => {
                if (char.alive) {
                    entities.push({ type: 'party', entity: char, initiative: calculateInitiative(char) });
                }
            });

            // Add alive enemies
            game.enemies.forEach(enemy => {
                if (enemy.currentHp > 0) {
                    entities.push({ type: 'enemy', entity: enemy, initiative: calculateInitiative(enemy) });
                }
            });

            // Sort by initiative descending, party before enemies on tie
            entities.sort((a, b) => {
                if (b.initiative !== a.initiative) return b.initiative - a.initiative;
                if (a.type === 'party' && b.type === 'enemy') return -1;
                if (a.type === 'enemy' && b.type === 'party') return 1;
                return a.entity.name.localeCompare(b.entity.name);
            });

            game.turnOrder = entities;
            game.currentTurnIndex = 0;
        }

        // ==================== STATUS EFFECTS ====================
        function applyStatusEffect(target, effect, duration, source) {
            // Check max effects (4)
            if (target.statusEffects.length >= 4) {
                target.statusEffects.shift(); // Remove oldest
            }

            // Refresh if same effect exists
            const existing = target.statusEffects.find(s => s.effect === effect);
            if (existing) {
                existing.duration = duration;
            } else {
                target.statusEffects.push({ effect, duration, source });
            }
        }

        function processStatusEffects(entity) {
            const messages = [];

            entity.statusEffects = entity.statusEffects.filter(status => {
                // Process burn
                if (status.effect === 'burn') {
                    const burnDamage = Math.floor(entity.maxHp * 0.05);
                    entity.currentHp = Math.max(0, entity.currentHp - burnDamage);
                    messages.push(`${entity.name} takes ${burnDamage} burn damage!`);
                }

                status.duration--;
                return status.duration > 0;
            });

            return messages;
        }

        function tickStatusDurations(entity) {
            entity.statusEffects = entity.statusEffects.filter(s => s.duration > 0);
        }

        // ==================== COMBAT ACTIONS ====================
        function performStrike(attacker, target) {
            const result = calcPhysicalDamage(attacker, target);

            // Apply guarding
            if (target.guarding) {
                result.damage = Math.floor(result.damage * GUARD_DAMAGE_MULT);
            }

            target.currentHp = Math.max(0, target.currentHp - result.damage);
            attacker.damageDealt = (attacker.damageDealt || 0) + result.damage;

            return result;
        }

        function performSkill(caster, skill, target) {
            if (game.lp < skill.lpCost) {
                return { success: false, message: 'Not enough LP!' };
            }

            game.lp -= skill.lpCost;

            switch (skill.type) {
                case 'damage': {
                    const result = calcSkillDamage(caster, target, skill);
                    if (target.guarding) {
                        result.damage = Math.floor(result.damage * GUARD_DAMAGE_MULT);
                    }
                    target.currentHp = Math.max(0, target.currentHp - result.damage);
                    caster.damageDealt = (caster.damageDealt || 0) + result.damage;
                    return { success: true, ...result, type: 'damage' };
                }

                case 'heal': {
                    const healAmount = calcHeal(caster, skill);
                    const actualHeal = Math.min(healAmount, target.maxHp - target.currentHp);
                    target.currentHp += actualHeal;
                    caster.healingDone = (caster.healingDone || 0) + actualHeal;
                    return { success: true, heal: actualHeal, type: 'heal' };
                }

                case 'heal_all': {
                    const healAmount = calcHeal(caster, skill);
                    let totalHeal = 0;
                    game.party.forEach(char => {
                        if (char.alive) {
                            const actualHeal = Math.min(healAmount, char.maxHp - char.currentHp);
                            char.currentHp += actualHeal;
                            totalHeal += actualHeal;
                        }
                    });
                    caster.healingDone = (caster.healingDone || 0) + totalHeal;
                    return { success: true, heal: totalHeal, type: 'heal_all' };
                }

                case 'buff': {
                    applyStatusEffect(target, skill.effect, skill.duration, caster.name);
                    return { success: true, type: 'buff', effect: skill.effect };
                }

                case 'debuff': {
                    applyStatusEffect(target, skill.effect, skill.duration, caster.name);
                    return { success: true, type: 'debuff', effect: skill.effect };
                }

                default:
                    return { success: false, message: 'Unknown skill type' };
            }
        }

        function performGuard(entity) {
            entity.guarding = true;
            game.lp = Math.min(MAX_LP, game.lp + GUARD_LP_BONUS);
            return { lpGained: GUARD_LP_BONUS };
        }

        // ==================== ENEMY AI ====================
        function getEnemyAction(enemy) {
            const aliveParty = game.party.filter(c => c.alive);
            if (aliveParty.length === 0) return null;

            // Calculate threat for each party member
            aliveParty.forEach(char => {
                char.threatScore = (char.damageDealt * 2) + (char.healingDone * 1.5) +
                    ((char.currentHp / char.maxHp) * 10);
            });

            const lowestHp = [...aliveParty].sort((a, b) => a.currentHp - b.currentHp)[0];
            const highestThreat = [...aliveParty].sort((a, b) => b.threatScore - a.threatScore)[0];
            const highestTap = [...aliveParty].sort((a, b) => b.tap - a.tap)[0];
            const randomTarget = aliveParty[Math.floor(Math.random() * aliveParty.length)];

            switch (enemy.ai) {
                case 'leyrat':
                    // Target lowest HP if any < 30%, else random
                    if (lowestHp.currentHp / lowestHp.maxHp < 0.3) {
                        return { action: 'strike', target: lowestHp };
                    }
                    return { action: 'strike', target: randomTarget };

                case 'cordwork':
                    // Turn cycle: strike, strike, desperate grab
                    enemy.turnCounter = (enemy.turnCounter || 0) + 1;
                    if (enemy.turnCounter % 3 === 0) {
                        return { action: 'strike', target: highestThreat, special: 'Desperate Grab' };
                    }
                    return { action: 'strike', target: randomTarget };

                case 'scout':
                    // Use Sear if available and target has thermal weakness
                    const thermalWeak = aliveParty.find(c => c.element === ELEMENTS.AETHERIC);
                    if (thermalWeak && enemy.skills) {
                        return { action: 'skill', skill: enemy.skills[0], target: thermalWeak };
                    }
                    return { action: 'strike', target: randomTarget };

                case 'wisp':
                    // Drain LP if party has > 50, else attack highest TAP
                    if (game.lp > 50 && enemy.skills) {
                        return { action: 'skill', skill: enemy.skills[0], target: highestTap };
                    }
                    return { action: 'strike', target: highestTap };

                case 'warden':
                    // Boss AI: Judgment on highest damage dealer, Purity Protocol to buff allies
                    enemy.turnCounter = (enemy.turnCounter || 0) + 1;
                    // Use Purity Protocol every 3rd turn if there are ally enemies
                    const allyEnemies = game.enemies.filter(e => e !== enemy && e.currentHp > 0);
                    if (enemy.turnCounter % 3 === 0 && allyEnemies.length > 0 && enemy.skills) {
                        return { action: 'skill', skill: enemy.skills[1], target: null, special: 'Purity Protocol' };
                    }
                    // Use Judgment on highest threat
                    if (enemy.skills) {
                        return { action: 'skill', skill: enemy.skills[0], target: highestThreat };
                    }
                    return { action: 'strike', target: highestThreat };

                case 'ironbound':
                    // Heavy hitter - uses Siege Blow every 2nd turn
                    enemy.turnCounter = (enemy.turnCounter || 0) + 1;
                    if (enemy.turnCounter % 2 === 0 && enemy.skills) {
                        return { action: 'skill', skill: enemy.skills[0], target: randomTarget };
                    }
                    return { action: 'strike', target: randomTarget };

                case 'remnant':
                    // Chaotic - Soul Scream on party when HP < 50%, else random attacks
                    if (enemy.currentHp < enemy.maxHp * 0.5 && enemy.skills) {
                        return { action: 'skill', skill: enemy.skills[0], target: null, special: 'Soul Scream' };
                    }
                    return { action: 'strike', target: randomTarget };

                case 'horror':
                    // Uses Memory Drown on highest TAP to disable casters
                    enemy.turnCounter = (enemy.turnCounter || 0) + 1;
                    if (enemy.turnCounter % 2 === 0 && enemy.skills) {
                        return { action: 'skill', skill: enemy.skills[0], target: highestTap, special: 'Memory Drown' };
                    }
                    return { action: 'strike', target: highestThreat };

                case 'convergence':
                    // Boss - alternates between Null Burst (LP drain) and attacks
                    enemy.turnCounter = (enemy.turnCounter || 0) + 1;
                    if (enemy.turnCounter % 3 === 1 && enemy.skills) {
                        return { action: 'skill', skill: enemy.skills[0], target: null, special: 'Null Burst' };
                    }
                    return { action: 'strike', target: highestThreat };

                case 'assemblage':
                    // Final Boss - complex pattern based on HP thresholds
                    enemy.turnCounter = (enemy.turnCounter || 0) + 1;
                    const hpPercent = enemy.currentHp / enemy.maxHp;

                    // Phase 2 at 50% HP - more aggressive
                    if (hpPercent <= 0.5 && !enemy.phase2) {
                        enemy.phase2 = true;
                    }

                    // Cycle through abilities
                    if (enemy.turnCounter % 4 === 1 && enemy.skills) {
                        // Nineteen Voices - AoE attack
                        return { action: 'skill', skill: enemy.skills[0], target: null, special: 'Nineteen Voices' };
                    } else if (enemy.turnCounter % 4 === 2 && enemy.skills) {
                        // When We Scream - LP drain
                        return { action: 'skill', skill: enemy.skills[2], target: null, special: 'When We Scream' };
                    } else if (enemy.turnCounter % 4 === 0 && enemy.skills) {
                        // It Should Hurt - massive single target
                        return { action: 'skill', skill: enemy.skills[1], target: highestThreat };
                    }
                    return { action: 'strike', target: randomTarget };

                default:
                    return { action: 'strike', target: randomTarget };
            }
        }

        // ==================== COMBAT FLOW ====================
        function startCombat(enemyIndices) {
            game.currentScene = 'combat';
            game.combatActive = true;
            game.combatTurnCount = 0;

            // Reset combat stats
            game.party.forEach(char => {
                char.guarding = false;
                char.damageDealt = 0;
                char.healingDone = 0;
            });

            // Initialize enemies
            game.enemies = enemyIndices.map((idx, i) => {
                const template = game.mapEnemies[idx];
                return {
                    ...template,
                    combatId: i,
                    currentHp: template.hp,
                    maxHp: template.hp,
                    statusEffects: [],
                    guarding: false,
                    turnCounter: 0
                };
            });

            // Build turn order
            buildTurnOrder();

            // Update UI
            updateCombatUI();
            showCombatScene();
            combatLog.textContent = 'Battle begins!';

            // Start first turn
            setTimeout(() => processNextTurn(), 800);
        }

        function processNextTurn() {
            if (!game.combatActive) return;

            // Check victory/defeat
            if (game.enemies.every(e => e.currentHp <= 0)) {
                endCombat(true);
                return;
            }
            if (game.party.every(c => !c.alive)) {
                endCombat(false);
                return;
            }

            // Get current turn entity
            if (game.currentTurnIndex >= game.turnOrder.length) {
                // New round - rebuild turn order
                buildTurnOrder();
                game.combatTurnCount++;
            }

            const current = game.turnOrder[game.currentTurnIndex];
            if (!current) {
                game.currentTurnIndex++;
                processNextTurn();
                return;
            }

            const entity = current.entity;

            // Skip dead entities
            if ((current.type === 'party' && !entity.alive) ||
                (current.type === 'enemy' && entity.currentHp <= 0)) {
                game.currentTurnIndex++;
                processNextTurn();
                return;
            }

            // Process status effects at start of turn
            const statusMessages = processStatusEffects(entity);
            if (statusMessages.length > 0) {
                combatLog.textContent = statusMessages.join(' ');
            }

            // Check if entity died from status
            if ((current.type === 'party' && entity.currentHp <= 0) ||
                (current.type === 'enemy' && entity.currentHp <= 0)) {
                if (current.type === 'party') {
                    entity.alive = false;
                }
                updateCombatUI();
                game.currentTurnIndex++;
                setTimeout(() => processNextTurn(), 600);
                return;
            }

            // Reset guarding
            entity.guarding = false;

            // LP regen for party members
            if (current.type === 'party') {
                game.lp = Math.min(MAX_LP, game.lp + LP_REGEN_PER_TURN);
            }

            updateCombatUI();

            if (current.type === 'party') {
                // Player turn - enable actions
                enablePlayerActions(entity);
            } else {
                // Enemy turn - AI decides
                setTimeout(() => executeEnemyTurn(entity), 600);
            }
        }

        function enablePlayerActions(character) {
            combatLog.textContent = `${character.name}'s turn!`;
            document.getElementById('action-label').textContent = `${character.name} - Choose action`;

            const strikeBtn = document.getElementById('strike-btn');
            const skillBtn = document.getElementById('skill-btn');
            const guardBtn = document.getElementById('guard-btn');

            strikeBtn.disabled = false;
            skillBtn.disabled = false;
            guardBtn.disabled = false;

            hideTargetSelection();
            hideSkillSelection();
            showMainActions();
        }

        function disablePlayerActions() {
            document.getElementById('strike-btn').disabled = true;
            document.getElementById('skill-btn').disabled = true;
            document.getElementById('guard-btn').disabled = true;
        }

        function executePlayerStrike(target) {
            disablePlayerActions();
            hideTargetSelection();

            const current = game.turnOrder[game.currentTurnIndex];
            const attacker = current.entity;

            const result = performStrike(attacker, target);

            let logMsg = `${attacker.name} strikes ${target.name} for ${result.damage}`;
            if (result.crit) logMsg += ' CRITICAL!';
            combatLog.textContent = logMsg;

            showFloatingNumber(target, result.damage, result.crit ? 'crit' : 'damage');
            flashElement(getEnemyElement(target.combatId));

            updateCombatUI();

            game.currentTurnIndex++;
            setTimeout(() => processNextTurn(), 800);
        }

        function executePlayerSkill(skill, target) {
            disablePlayerActions();
            hideSkillSelection();
            hideTargetSelection();

            const current = game.turnOrder[game.currentTurnIndex];
            const caster = current.entity;

            const result = performSkill(caster, skill, target);

            if (!result.success) {
                combatLog.textContent = result.message;
                enablePlayerActions(caster);
                return;
            }

            let logMsg = `${caster.name} uses ${skill.name}`;

            switch (result.type) {
                case 'damage':
                    logMsg += ` on ${target.name} for ${result.damage}`;
                    if (result.crit) logMsg += ' CRITICAL!';
                    showFloatingNumber(target, result.damage, result.crit ? 'crit' : 'damage');
                    if (target.combatId !== undefined) {
                        flashElement(getEnemyElement(target.combatId));
                    }
                    break;

                case 'heal':
                    logMsg += ` - ${target.name} healed for ${result.heal}`;
                    showFloatingNumber(target, result.heal, 'heal');
                    break;

                case 'heal_all':
                    logMsg += ` - Party healed for ${result.heal}`;
                    break;

                case 'buff':
                case 'debuff':
                    logMsg += ` on ${target.name}`;
                    break;
            }

            combatLog.textContent = logMsg;
            updateCombatUI();

            game.currentTurnIndex++;
            setTimeout(() => processNextTurn(), 800);
        }

        function executePlayerGuard() {
            disablePlayerActions();

            const current = game.turnOrder[game.currentTurnIndex];
            const entity = current.entity;

            const result = performGuard(entity);

            combatLog.textContent = `${entity.name} guards! +${result.lpGained} LP`;
            showFloatingNumber(entity, result.lpGained, 'lp');

            updateCombatUI();

            game.currentTurnIndex++;
            setTimeout(() => processNextTurn(), 800);
        }

        function executeEnemyTurn(enemy) {
            const action = getEnemyAction(enemy);
            if (!action) {
                game.currentTurnIndex++;
                processNextTurn();
                return;
            }

            switch (action.action) {
                case 'strike': {
                    const result = performStrike(enemy, action.target);
                    let logMsg = action.special ?
                        `${enemy.name} uses ${action.special} on ${action.target.name} for ${result.damage}!` :
                        `${enemy.name} strikes ${action.target.name} for ${result.damage}!`;
                    if (result.crit) logMsg += ' CRITICAL!';
                    combatLog.textContent = logMsg;

                    showFloatingNumber(action.target, result.damage, result.crit ? 'crit' : 'damage');
                    flashElement(getPartyMemberElement(action.target.id));

                    // Check if target died
                    if (action.target.currentHp <= 0) {
                        action.target.alive = false;
                    }
                    break;
                }

                case 'skill': {
                    if (action.skill.lpDrain) {
                        // LP drain skill
                        const drain = action.skill.lpDrain;
                        game.lp = Math.max(0, game.lp - drain);
                        combatLog.textContent = `${enemy.name} uses ${action.skill.name}! Party loses ${drain} LP!`;
                        showFloatingNumber(action.target, drain, 'lp');
                    } else if (action.skill.multiplier) {
                        // Damage skill
                        const result = calcSkillDamage(enemy, action.target, action.skill);
                        if (action.target.guarding) {
                            result.damage = Math.floor(result.damage * GUARD_DAMAGE_MULT);
                        }
                        action.target.currentHp = Math.max(0, action.target.currentHp - result.damage);

                        combatLog.textContent = `${enemy.name} uses ${action.skill.name} on ${action.target.name} for ${result.damage}!`;
                        showFloatingNumber(action.target, result.damage, result.crit ? 'crit' : 'damage');
                        flashElement(getPartyMemberElement(action.target.id));

                        if (action.target.currentHp <= 0) {
                            action.target.alive = false;
                        }
                    }
                    break;
                }
            }

            updateCombatUI();

            game.currentTurnIndex++;
            setTimeout(() => processNextTurn(), 1000);
        }

        function endCombat(victory) {
            game.combatActive = false;
            disablePlayerActions();

            // Check if this is a story combat
            const isStoryCombat = game.pendingSceneId !== undefined;

            setTimeout(() => {
                const resultEl = document.getElementById('combat-result');
                const resultText = document.getElementById('result-text');
                const rewardsText = document.getElementById('rewards-text');
                const xpGainEl = document.getElementById('xp-gain');

                resultEl.style.display = 'flex';

                if (victory) {
                    resultText.textContent = 'VICTORY!';
                    resultText.className = 'victory';

                    // Calculate rewards
                    let totalXP = 0;
                    let totalGold = 0;

                    game.enemies.forEach(enemy => {
                        // Mark map enemy as defeated (only for exploration combat)
                        if (!isStoryCombat) {
                            const mapEnemy = game.mapEnemies.find(e => e.id === enemy.id);
                            if (mapEnemy) mapEnemy.alive = false;
                        }

                        // XP formula: Enemy HP * 0.5 * level modifier
                        const baseXP = Math.floor(enemy.maxHp * 0.5);
                        totalXP += baseXP;
                        totalGold += enemy.gold;
                    });

                    game.partyXP += totalXP;
                    game.gold += totalGold;

                    rewardsText.textContent = `+${totalGold}g`;
                    xpGainEl.textContent = `+${totalXP} XP`;

                    // Check for level up
                    checkLevelUp();
                } else {
                    resultText.textContent = 'DEFEAT';
                    resultText.className = 'defeat';
                    rewardsText.textContent = '';
                    xpGainEl.textContent = 'Retrying...';

                    // Restore party HP on defeat
                    game.party.forEach(char => {
                        char.currentHp = char.maxHp;
                        char.alive = true;
                        char.statusEffects = [];
                    });
                }

                // Store victory state for continue button
                game.lastCombatVictory = victory;
                game.lastCombatWasStory = isStoryCombat;
            }, 600);
        }

        function checkLevelUp() {
            const xpNeeded = getXPForLevel(game.partyLevel);
            if (game.partyXP >= xpNeeded && game.partyLevel < 10) {
                game.partyXP -= xpNeeded;
                game.partyLevel++;

                // Level up all party members
                game.party.forEach(char => {
                    const template = CHARACTER_TEMPLATES[char.id];
                    const oldStats = { ...char };

                    char.level = game.partyLevel;
                    char.maxHp += template.growth.hp;
                    char.atk += template.growth.atk;
                    char.def += template.growth.def;
                    char.tap += template.growth.tap;
                    char.spd += template.growth.spd;
                    char.currentHp = char.maxHp; // Full heal on level up

                    game.levelUpQueue.push({ char, oldStats });
                });
            }
        }

        function showNextLevelUp() {
            if (game.levelUpQueue.length === 0) {
                document.getElementById('levelup-overlay').classList.remove('active');

                // Check if all enemies defeated
                if (game.mapEnemies.every(e => !e.alive)) {
                    showDialog(allClearedDialog, switchToExploration);
                } else {
                    switchToExploration();
                }
                return;
            }

            const levelUp = game.levelUpQueue.shift();
            const { char, oldStats } = levelUp;

            document.getElementById('levelup-char').textContent = char.name;
            document.getElementById('levelup-stats').innerHTML = `
                <div>Level: ${oldStats.level} → ${char.level}</div>
                <div>HP: ${oldStats.maxHp} → ${char.maxHp}</div>
                <div>ATK: ${oldStats.atk} → ${char.atk}</div>
                <div>DEF: ${oldStats.def} → ${char.def}</div>
                <div>TAP: ${oldStats.tap} → ${char.tap}</div>
                <div>SPD: ${oldStats.spd} → ${char.spd}</div>
            `;

            document.getElementById('levelup-overlay').classList.add('active');
        }

        // ==================== UI UPDATES ====================
        function updateCombatUI() {
            // Update turn order display
            const turnOrderEl = document.getElementById('turn-order');
            turnOrderEl.innerHTML = '';
            game.turnOrder.slice(0, 8).forEach((turn, i) => {
                const icon = document.createElement('div');
                icon.className = `turn-icon ${turn.type}`;
                if (i === game.currentTurnIndex) icon.classList.add('active');
                icon.textContent = turn.entity.name.substring(0, 2).toUpperCase();
                turnOrderEl.appendChild(icon);
            });

            // Update LP bar
            document.getElementById('lp-bar').style.width = `${(game.lp / MAX_LP) * 100}%`;
            document.getElementById('lp-label').textContent = `LP: ${game.lp} / ${MAX_LP}`;

            // Update enemies
            const enemiesArea = document.getElementById('enemies-area');
            enemiesArea.innerHTML = '';
            game.enemies.forEach(enemy => {
                const el = document.createElement('div');
                el.className = `combat-enemy ${enemy.cssClass}`;
                el.id = `combat-enemy-${enemy.combatId}`;
                if (enemy.currentHp <= 0) el.classList.add('dead');

                el.innerHTML = `
                    <div class="enemy-name-label">${enemy.name}</div>
                    <div class="enemy-face">
                        <div class="enemy-eyes">
                            <div class="enemy-eye"></div>
                            <div class="enemy-eye"></div>
                        </div>
                        <div class="enemy-mouth"></div>
                    </div>
                    <div class="enemy-hp-mini">
                        <div class="enemy-hp-mini-fill" style="width: ${(enemy.currentHp / enemy.maxHp) * 100}%"></div>
                    </div>
                `;
                enemiesArea.appendChild(el);
            });

            // Update party members
            const partyArea = document.getElementById('party-area');
            partyArea.innerHTML = '';
            game.party.forEach(char => {
                const el = document.createElement('div');
                el.className = 'party-member';
                el.id = `party-member-${char.id}`;
                if (!char.alive) el.classList.add('dead');

                const current = game.turnOrder[game.currentTurnIndex];
                if (current && current.type === 'party' && current.entity.id === char.id) {
                    el.classList.add('active-turn');
                }

                // Status icons
                let statusHtml = '';
                char.statusEffects.forEach(s => {
                    let icon = '?';
                    let color = '#888';
                    switch (s.effect) {
                        case 'atk_up': icon = '⬆'; color = '#ef4444'; break;
                        case 'taunt': icon = '🎯'; color = '#3b82f6'; break;
                        case 'def_down': icon = '⬇'; color = '#f97316'; break;
                        case 'weakness_revealed': icon = '👁'; color = '#fbbf24'; break;
                        case 'interpose': icon = '🛡'; color = '#22c55e'; break;
                    }
                    statusHtml += `<div class="status-icon" style="background:${color}">${icon}</div>`;
                });

                el.innerHTML = `
                    <div class="pm-sprite ${char.id}">
                        <div class="pm-face"></div>
                    </div>
                    <div class="pm-name">${char.name}</div>
                    <div class="pm-hp-bar">
                        <div class="pm-hp-fill" style="width: ${(char.currentHp / char.maxHp) * 100}%"></div>
                    </div>
                    <div class="pm-hp-text">${char.currentHp}/${char.maxHp}</div>
                    <div class="pm-status">${statusHtml}</div>
                `;
                partyArea.appendChild(el);
            });
        }

        function updateExplorationUI() {
            document.getElementById('hud-party-level').textContent = `Party Lv. ${game.partyLevel}`;
            document.getElementById('hud-lp').textContent = `LP: ${game.lp}/${MAX_LP}`;
            document.getElementById('hud-gold').textContent = `${game.gold}g`;

            const miniBars = document.getElementById('party-mini-bars');
            miniBars.innerHTML = '';
            game.party.forEach(char => {
                const el = document.createElement('div');
                el.className = 'mini-char';
                el.innerHTML = `
                    <div class="mini-char-name">${char.name}</div>
                    <div class="mini-hp-bar">
                        <div class="mini-hp-fill" style="width: ${(char.currentHp / char.maxHp) * 100}%"></div>
                    </div>
                `;
                miniBars.appendChild(el);
            });
        }

        // ==================== UI HELPERS ====================
        function showMainActions() {
            document.getElementById('combat-actions').style.display = 'flex';
            document.getElementById('target-selection').classList.remove('active');
            document.getElementById('skill-selection').classList.remove('active');
        }

        function hideMainActions() {
            document.getElementById('combat-actions').style.display = 'none';
        }

        function showTargetSelection(targets, callback) {
            hideMainActions();
            const container = document.getElementById('target-buttons');
            container.innerHTML = '';

            targets.forEach(target => {
                const btn = document.createElement('button');
                btn.className = 'target-btn';
                btn.textContent = target.name;
                btn.onclick = () => callback(target);
                container.appendChild(btn);
            });

            const cancelBtn = document.createElement('button');
            cancelBtn.id = 'cancel-target-btn';
            cancelBtn.className = 'target-btn';
            cancelBtn.textContent = 'Cancel';
            cancelBtn.onclick = () => {
                hideTargetSelection();
                const current = game.turnOrder[game.currentTurnIndex];
                enablePlayerActions(current.entity);
            };
            container.appendChild(cancelBtn);

            document.getElementById('target-selection').classList.add('active');
        }

        function hideTargetSelection() {
            document.getElementById('target-selection').classList.remove('active');
            showMainActions();
        }

        function showSkillSelection(character) {
            hideMainActions();
            const container = document.getElementById('skill-buttons');
            container.innerHTML = '';

            character.skills.forEach(skill => {
                const btn = document.createElement('button');
                btn.className = 'skill-select-btn';
                btn.innerHTML = `${skill.name}<br><span class="skill-lp">${skill.lpCost} LP</span>`;
                btn.disabled = game.lp < skill.lpCost;
                btn.onclick = () => {
                    game.selectedSkill = skill;
                    hideSkillSelection();

                    // Determine valid targets
                    if (skill.target === 'enemy') {
                        const targets = game.enemies.filter(e => e.currentHp > 0);
                        showTargetSelection(targets, (target) => executePlayerSkill(skill, target));
                    } else if (skill.target === 'ally') {
                        const targets = game.party.filter(c => c.alive);
                        showTargetSelection(targets, (target) => executePlayerSkill(skill, target));
                    } else if (skill.target === 'self') {
                        executePlayerSkill(skill, character);
                    } else {
                        // All party (heal_all etc)
                        executePlayerSkill(skill, null);
                    }
                };
                container.appendChild(btn);
            });

            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'skill-select-btn';
            cancelBtn.textContent = 'Cancel';
            cancelBtn.onclick = () => {
                hideSkillSelection();
                enablePlayerActions(character);
            };
            container.appendChild(cancelBtn);

            document.getElementById('skill-selection').classList.add('active');
        }

        function hideSkillSelection() {
            document.getElementById('skill-selection').classList.remove('active');
            showMainActions();
        }

        function showFloatingNumber(entity, value, type) {
            const num = document.createElement('div');
            num.className = `floating-number ${type}`;
            num.textContent = (type === 'heal' || type === 'lp') ? `+${value}` : `-${value}`;

            // Position based on entity type
            let targetEl;
            if (entity.combatId !== undefined) {
                targetEl = document.getElementById(`combat-enemy-${entity.combatId}`);
            } else if (entity.id) {
                targetEl = document.getElementById(`party-member-${entity.id}`);
            }

            if (targetEl) {
                const rect = targetEl.getBoundingClientRect();
                num.style.left = `${rect.left + rect.width / 2}px`;
                num.style.top = `${rect.top}px`;
            }

            document.body.appendChild(num);
            setTimeout(() => num.remove(), 1000);
        }

        function flashElement(el) {
            if (el) {
                el.classList.add('damage-flash');
                setTimeout(() => el.classList.remove('damage-flash'), 300);
            }
        }

        function getEnemyElement(combatId) {
            return document.getElementById(`combat-enemy-${combatId}`);
        }

        function getPartyMemberElement(charId) {
            return document.getElementById(`party-member-${charId}`);
        }

        // ==================== SCENE MANAGEMENT ====================
        function showDialog(script, callback) {
            game.dialogQueue = [...script];
            game.dialogCallback = callback;
            game.dialogIndex = 0;

            // Hide choice container and scene location
            document.getElementById('choice-container').classList.remove('active');
            document.getElementById('scene-location').classList.remove('active');

            const line = game.dialogQueue[0];
            updateDialogDisplay(line);

            game.currentScene = 'dialog';
            document.getElementById('dialog-scene').classList.add('active');
            document.getElementById('exploration-scene').style.display = 'none';
            document.getElementById('combat-scene').style.display = 'none';
        }

        function advanceDialog() {
            // Don't advance if choice is active
            if (document.getElementById('choice-container').classList.contains('active')) {
                return;
            }

            game.dialogIndex++;

            if (game.dialogIndex >= game.dialogQueue.length) {
                document.getElementById('dialog-scene').classList.remove('active');
                if (game.dialogCallback) {
                    game.dialogCallback();
                }
                return;
            }

            const line = game.dialogQueue[game.dialogIndex];
            updateDialogDisplay(line);
        }

        function switchToExploration() {
            game.currentScene = 'exploration';
            document.getElementById('dialog-scene').classList.remove('active');
            document.getElementById('exploration-scene').style.display = 'block';
            document.getElementById('combat-scene').style.display = 'none';

            initWorld();
            updateExplorationUI();
        }

        function showCombatScene() {
            document.getElementById('dialog-scene').classList.remove('active');
            document.getElementById('exploration-scene').style.display = 'none';
            document.getElementById('combat-scene').style.display = 'block';
        }

        // ==================== EXPLORATION ====================
        function initWorld() {
            const world = document.getElementById('world');
            const enemiesContainer = document.getElementById('enemies-container');
            world.innerHTML = '';
            enemiesContainer.innerHTML = '';

            const cols = Math.ceil(window.innerWidth / 40) + 2;
            const rows = Math.ceil(window.innerHeight / 40) + 2;

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'grass-tile';
                    tile.style.left = (x * 40) + 'px';
                    tile.style.top = (y * 40) + 'px';
                    const shade = Math.random() * 15 - 7;
                    tile.style.background = `rgb(${58 + shade}, ${80 + shade}, ${50 + shade})`;
                    world.appendChild(tile);
                }
            }

            // Center player
            game.playerPos.x = window.innerWidth / 2 - 18;
            game.playerPos.y = window.innerHeight / 2 - 27;
            updatePlayerPosition();

            // Position enemies
            const positions = [
                { x: window.innerWidth * 0.2, y: window.innerHeight * 0.2 },
                { x: window.innerWidth * 0.75, y: window.innerHeight * 0.18 },
                { x: window.innerWidth * 0.15, y: window.innerHeight * 0.55 },
                { x: window.innerWidth * 0.78, y: window.innerHeight * 0.5 }
            ];

            game.mapEnemies.forEach((enemy, i) => {
                if (enemy.alive) {
                    enemy.x = positions[i].x;
                    enemy.y = positions[i].y;
                    createMapEnemy(enemy);
                }
            });
        }

        function createMapEnemy(enemy) {
            const el = document.createElement('div');
            el.className = `enemy-map ${enemy.cssClass}`;
            el.id = `map-enemy-${enemy.id}`;
            el.innerHTML = `
                <div class="enemy-face">
                    <div class="enemy-eyes">
                        <div class="enemy-eye"></div>
                        <div class="enemy-eye"></div>
                    </div>
                    <div class="enemy-mouth"></div>
                </div>
            `;
            el.style.left = enemy.x + 'px';
            el.style.top = enemy.y + 'px';
            document.getElementById('enemies-container').appendChild(el);
        }

        function updatePlayerPosition() {
            const player = document.getElementById('player');
            player.style.left = game.playerPos.x + 'px';
            player.style.top = game.playerPos.y + 'px';
        }

        function checkEnemyCollision() {
            const px = game.playerPos.x + 18;
            const py = game.playerPos.y + 27;

            for (let i = 0; i < game.mapEnemies.length; i++) {
                const enemy = game.mapEnemies[i];
                if (!enemy.alive) continue;

                const ex = enemy.x + 22;
                const ey = enemy.y + 22;
                const dist = Math.sqrt((px - ex) ** 2 + (py - ey) ** 2);

                if (dist < 45) {
                    return [i];
                }
            }
            return null;
        }

        // ==================== JOYSTICK CONTROLS ====================
        function handleJoystickStart(e) {
            e.preventDefault();
            game.joystick.active = true;
            handleJoystickMove(e);
        }

        function handleJoystickMove(e) {
            if (!game.joystick.active) return;
            e.preventDefault();

            const joystickArea = document.getElementById('joystick-area');
            const joystickKnob = document.getElementById('joystick-knob');
            const rect = joystickArea.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            let dx = clientX - centerX;
            let dy = clientY - centerY;

            const maxDist = 30;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            joystickKnob.style.left = `calc(50% + ${dx}px)`;
            joystickKnob.style.top = `calc(50% + ${dy}px)`;

            game.joystick.dx = dx / maxDist;
            game.joystick.dy = dy / maxDist;
        }

        function handleJoystickEnd(e) {
            e.preventDefault();
            game.joystick.active = false;
            game.joystick.dx = 0;
            game.joystick.dy = 0;

            const joystickKnob = document.getElementById('joystick-knob');
            joystickKnob.style.left = '50%';
            joystickKnob.style.top = '50%';
        }

        // ==================== GAME LOOP ====================
        function gameLoop() {
            if (game.currentScene === 'exploration' && game.joystick.active) {
                const speed = 4;
                game.playerPos.x += game.joystick.dx * speed;
                game.playerPos.y += game.joystick.dy * speed;

                game.playerPos.x = Math.max(0, Math.min(window.innerWidth - 36, game.playerPos.x));
                game.playerPos.y = Math.max(80, Math.min(window.innerHeight - 54, game.playerPos.y));

                updatePlayerPosition();

                // Check for enemy collision
                const enemyIndices = checkEnemyCollision();
                if (enemyIndices) {
                    game.joystick.active = false;
                    startCombat(enemyIndices);
                }
            }
            requestAnimationFrame(gameLoop);
        }

        // ==================== EVENT LISTENERS ====================
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize game
            initParty();
            initMapEnemies();
            game.lp = STARTING_LP;

            // Start with the Prologue
            playScene('opening');

            // Dialog handlers
            const dialogScene = document.getElementById('dialog-scene');
            dialogScene.addEventListener('click', advanceDialog);
            dialogScene.addEventListener('touchend', (e) => {
                e.preventDefault();
                advanceDialog();
            });

            // Joystick handlers
            const joystickArea = document.getElementById('joystick-area');
            joystickArea.addEventListener('touchstart', handleJoystickStart, { passive: false });
            joystickArea.addEventListener('touchmove', handleJoystickMove, { passive: false });
            joystickArea.addEventListener('touchend', handleJoystickEnd, { passive: false });
            joystickArea.addEventListener('mousedown', handleJoystickStart);
            document.addEventListener('mousemove', handleJoystickMove);
            document.addEventListener('mouseup', handleJoystickEnd);

            // Combat buttons
            document.getElementById('strike-btn').addEventListener('click', () => {
                const current = game.turnOrder[game.currentTurnIndex];
                if (current && current.type === 'party') {
                    const targets = game.enemies.filter(e => e.currentHp > 0);
                    showTargetSelection(targets, executePlayerStrike);
                }
            });

            document.getElementById('skill-btn').addEventListener('click', () => {
                const current = game.turnOrder[game.currentTurnIndex];
                if (current && current.type === 'party') {
                    showSkillSelection(current.entity);
                }
            });

            document.getElementById('guard-btn').addEventListener('click', executePlayerGuard);

            // Continue button
            document.getElementById('continue-btn').addEventListener('click', () => {
                document.getElementById('combat-result').style.display = 'none';

                if (game.levelUpQueue.length > 0) {
                    showNextLevelUp();
                } else if (game.lastCombatWasStory) {
                    // Story combat - continue story progression
                    onStoryCombatEnd(game.lastCombatVictory);
                    game.pendingSceneId = undefined;
                    game.lastCombatWasStory = false;
                } else if (game.mapEnemies.every(e => !e.alive)) {
                    showDialog(allClearedDialog, switchToExploration);
                } else {
                    switchToExploration();
                }
            });

            // Level up button
            document.getElementById('levelup-btn').addEventListener('click', showNextLevelUp);

            // Start game loop
            gameLoop();

            // Combat log element reference
            window.combatLog = document.getElementById('combat-log');
        });
    </script>
</body>
</html>

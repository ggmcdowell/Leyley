<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>The Loom of Ashveld</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }
        body {
            background-color: #1a1a2e;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        #game {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Dialog Scene */
        #dialog-scene {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #2d132c 0%, #1a1a2e 100%);
            display: none;
        }
        #dialog-scene.active {
            display: block;
        }
        .dialog-sprite {
            position: absolute;
            bottom: 180px;
            width: 70px;
            height: 100px;
            border-radius: 8px;
        }
        #sprite-left {
            left: 10%;
            background: linear-gradient(to bottom, #4a9fff 0%, #2563eb 100%);
            border: 3px solid #1d4ed8;
        }
        #sprite-right {
            right: 10%;
            background: linear-gradient(to bottom, #22c55e 0%, #15803d 100%);
            border: 3px solid #14532d;
        }
        .dialog-sprite-face {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
        }
        .dialog-sprite-eyes {
            position: absolute;
            top: 12px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .dialog-sprite-eye {
            width: 6px;
            height: 6px;
            background: #333;
            border-radius: 50%;
        }
        .dialog-sprite-mouth {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 5px;
            background: #333;
            border-radius: 0 0 10px 10px;
        }
        .dialog-sprite-label {
            position: absolute;
            bottom: -22px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
        }
        #dialog-box {
            position: absolute;
            bottom: 20px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #4a3b6b;
            border-radius: 12px;
            padding: 15px;
            min-height: 120px;
        }
        #dialog-speaker {
            color: #a78bfa;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }
        #dialog-text {
            color: #fff;
            font-size: 15px;
            line-height: 1.4;
        }
        #dialog-continue {
            position: absolute;
            bottom: 10px;
            right: 15px;
            color: #666;
            font-size: 11px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Exploration Scene */
        #exploration-scene {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #2d3a27;
            display: none;
        }
        #world {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .grass-tile {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #3a5032;
            border: 1px solid #2d3a27;
        }

        /* Party HUD */
        #party-hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            padding: 8px;
            z-index: 150;
        }
        #hud-top-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        #hud-party-level {
            color: #fbbf24;
            font-weight: bold;
            font-size: 13px;
        }
        #hud-lp {
            color: #67e8f9;
            font-size: 13px;
            font-weight: bold;
        }
        #hud-gold {
            color: #fbbf24;
            font-size: 12px;
        }
        #party-mini-bars {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .mini-char {
            flex: 1;
            min-width: 70px;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            padding: 4px;
        }
        .mini-char-name {
            font-size: 10px;
            color: #a78bfa;
            font-weight: bold;
            margin-bottom: 2px;
        }
        .mini-hp-bar {
            height: 6px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
        }
        .mini-hp-fill {
            height: 100%;
            background: linear-gradient(to right, #22c55e, #4ade80);
            transition: width 0.3s;
        }

        #player {
            position: absolute;
            width: 36px;
            height: 54px;
            background: linear-gradient(to bottom, #4a9fff 0%, #2563eb 100%);
            border: 2px solid #1d4ed8;
            border-radius: 6px;
            z-index: 100;
            transition: left 0.05s, top 0.05s;
        }
        #player .sprite-face {
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 26px;
            height: 26px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
        }
        #player .sprite-eyes {
            position: absolute;
            top: 7px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 6px;
        }
        #player .sprite-eye {
            width: 4px;
            height: 4px;
            background: #333;
            border-radius: 50%;
        }
        #player .sprite-mouth {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 3px;
            background: #333;
            border-radius: 0 0 6px 6px;
        }

        /* Enemy on map */
        .enemy-map {
            position: absolute;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            z-index: 99;
            cursor: pointer;
        }
        .enemy-map .enemy-face {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 28px;
            height: 18px;
        }
        .enemy-map .enemy-eyes {
            display: flex;
            justify-content: space-between;
            padding: 0 2px;
        }
        .enemy-map .enemy-eye {
            width: 7px;
            height: 7px;
            background: #fff;
            border-radius: 50%;
        }
        .enemy-map .enemy-mouth {
            width: 16px;
            height: 6px;
            background: #000;
            margin: 3px auto 0;
            border-radius: 0 0 8px 8px;
        }
        .enemy-leyrat {
            background: linear-gradient(to bottom, #6b7280 0%, #4b5563 100%);
            border: 3px solid #374151;
        }
        .enemy-cordwork {
            background: linear-gradient(to bottom, #a855f7 0%, #7c3aed 100%);
            border: 3px solid #5b21b6;
        }
        .enemy-scout {
            background: linear-gradient(to bottom, #ef4444 0%, #b91c1c 100%);
            border: 3px solid #7f1d1d;
        }
        .enemy-wisp {
            background: linear-gradient(to bottom, #22d3ee 0%, #0891b2 100%);
            border: 3px solid #155e75;
        }

        /* Virtual Joystick */
        #joystick-area {
            position: absolute;
            bottom: 25px;
            left: 25px;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            z-index: 200;
        }
        #joystick-knob {
            position: absolute;
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 201;
        }

        /* Combat Scene */
        #combat-scene {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #1a1a2e 0%, #0f0f1a 100%);
            display: none;
        }
        #combat-background {
            position: absolute;
            width: 100%;
            height: 35%;
            top: 0;
            background: linear-gradient(to bottom, #2d1b4e 0%, #1a1a2e 100%);
            border-bottom: 2px solid #4a3b6b;
        }

        /* Turn Order Queue */
        #turn-order {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            display: flex;
            gap: 4px;
            z-index: 300;
        }
        .turn-icon {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: #fff;
            border: 2px solid transparent;
            opacity: 0.7;
        }
        .turn-icon.active {
            opacity: 1;
            border-color: #fbbf24;
            box-shadow: 0 0 8px #fbbf24;
        }
        .turn-icon.party {
            background: linear-gradient(to bottom, #3b82f6, #1d4ed8);
        }
        .turn-icon.enemy {
            background: linear-gradient(to bottom, #ef4444, #b91c1c);
        }

        /* Enemy Display */
        #enemies-area {
            position: absolute;
            top: 50px;
            left: 0;
            right: 0;
            height: calc(35% - 50px);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            padding: 10px;
        }
        .combat-enemy {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            position: relative;
            transition: transform 0.2s, opacity 0.3s;
        }
        .combat-enemy.targeted {
            transform: scale(1.1);
            box-shadow: 0 0 15px #fbbf24;
        }
        .combat-enemy.dead {
            opacity: 0.3;
            filter: grayscale(1);
        }
        .combat-enemy .enemy-face {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .enemy-hp-mini {
            position: absolute;
            bottom: -8px;
            left: 5px;
            right: 5px;
            height: 5px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
        }
        .enemy-hp-mini-fill {
            height: 100%;
            background: #ef4444;
            transition: width 0.3s;
        }
        .enemy-name-label {
            position: absolute;
            top: -16px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 9px;
            white-space: nowrap;
        }

        /* Combat Log */
        #combat-log {
            position: absolute;
            top: 36%;
            left: 10px;
            right: 10px;
            text-align: center;
            color: #fbbf24;
            font-size: 13px;
            font-weight: bold;
            text-shadow: 1px 1px 3px #000;
            min-height: 20px;
        }

        /* LP Bar */
        #lp-bar-container {
            position: absolute;
            top: calc(36% + 24px);
            left: 15%;
            right: 15%;
            height: 18px;
            background: #222;
            border-radius: 9px;
            border: 2px solid #0891b2;
            overflow: hidden;
        }
        #lp-bar {
            height: 100%;
            background: linear-gradient(to right, #06b6d4, #22d3ee);
            transition: width 0.3s;
        }
        #lp-label {
            position: absolute;
            top: calc(36% + 24px);
            left: 15%;
            right: 15%;
            height: 18px;
            line-height: 18px;
            text-align: center;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
            z-index: 10;
        }

        /* Party Display */
        #party-area {
            position: absolute;
            top: calc(36% + 50px);
            left: 0;
            right: 0;
            bottom: 140px;
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 8px;
            overflow-x: auto;
        }
        .party-member {
            flex: 0 0 auto;
            width: 75px;
            background: rgba(0,0,0,0.6);
            border-radius: 8px;
            padding: 6px;
            border: 2px solid #333;
            transition: border-color 0.2s, transform 0.2s;
        }
        .party-member.active-turn {
            border-color: #fbbf24;
            transform: scale(1.05);
        }
        .party-member.dead {
            opacity: 0.4;
            filter: grayscale(0.5);
        }
        .party-member.targeted {
            border-color: #ef4444;
            box-shadow: 0 0 10px #ef4444;
        }
        .pm-sprite {
            width: 40px;
            height: 50px;
            margin: 0 auto 4px;
            border-radius: 6px;
            position: relative;
        }
        .pm-sprite.silas { background: linear-gradient(to bottom, #4a9fff, #2563eb); border: 2px solid #1d4ed8; }
        .pm-sprite.corra { background: linear-gradient(to bottom, #a78bfa, #7c3aed); border: 2px solid #5b21b6; }
        .pm-sprite.vesk { background: linear-gradient(to bottom, #f97316, #ea580c); border: 2px solid #c2410c; }
        .pm-sprite.echo { background: linear-gradient(to bottom, #22d3ee, #06b6d4); border: 2px solid #0891b2; }
        .pm-face {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 24px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
        }
        .pm-name {
            text-align: center;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            margin-bottom: 3px;
        }
        .pm-hp-bar {
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 2px;
        }
        .pm-hp-fill {
            height: 100%;
            background: linear-gradient(to right, #22c55e, #4ade80);
            transition: width 0.3s;
        }
        .pm-hp-text {
            text-align: center;
            color: #22c55e;
            font-size: 9px;
        }
        .pm-status {
            display: flex;
            gap: 2px;
            justify-content: center;
            margin-top: 3px;
            min-height: 14px;
        }
        .status-icon {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            font-size: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Combat UI */
        #combat-ui {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 140px;
            background: rgba(0, 0, 0, 0.95);
            border-top: 2px solid #4a3b6b;
            padding: 8px;
        }
        #action-label {
            text-align: center;
            color: #a78bfa;
            font-size: 12px;
            margin-bottom: 6px;
        }
        #combat-actions {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .combat-btn {
            padding: 10px 14px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.1s;
            min-width: 70px;
        }
        .combat-btn:active {
            transform: scale(0.95);
        }
        .combat-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        #strike-btn {
            background: linear-gradient(to bottom, #ef4444, #b91c1c);
            color: #fff;
            border: 2px solid #7f1d1d;
        }
        #guard-btn {
            background: linear-gradient(to bottom, #3b82f6, #1d4ed8);
            color: #fff;
            border: 2px solid #1e40af;
        }
        #skill-btn {
            background: linear-gradient(to bottom, #a855f7, #7c3aed);
            color: #fff;
            border: 2px solid #5b21b6;
        }
        .skill-cost {
            font-size: 9px;
            display: block;
            opacity: 0.8;
        }

        /* Target Selection */
        #target-selection {
            display: none;
            text-align: center;
        }
        #target-selection.active {
            display: block;
        }
        #target-label {
            color: #fbbf24;
            font-size: 12px;
            margin-bottom: 6px;
        }
        #target-buttons {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .target-btn {
            padding: 8px 12px;
            font-size: 11px;
            background: linear-gradient(to bottom, #374151, #1f2937);
            color: #fff;
            border: 2px solid #4b5563;
            border-radius: 6px;
            cursor: pointer;
        }
        .target-btn:hover {
            border-color: #fbbf24;
        }
        #cancel-target-btn {
            background: linear-gradient(to bottom, #6b7280, #4b5563);
            border-color: #374151;
        }

        /* Skill Selection */
        #skill-selection {
            display: none;
            text-align: center;
        }
        #skill-selection.active {
            display: block;
        }
        #skill-label {
            color: #a855f7;
            font-size: 12px;
            margin-bottom: 6px;
        }
        #skill-buttons {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .skill-select-btn {
            padding: 8px 12px;
            font-size: 11px;
            background: linear-gradient(to bottom, #7c3aed, #5b21b6);
            color: #fff;
            border: 2px solid #4c1d95;
            border-radius: 6px;
            cursor: pointer;
        }
        .skill-select-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .skill-select-btn .skill-lp {
            font-size: 9px;
            opacity: 0.8;
        }

        /* Combat Result Overlay */
        #combat-result {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 400;
        }
        #result-text {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        #result-text.victory { color: #22c55e; }
        #result-text.defeat { color: #ef4444; }
        #rewards-text {
            color: #fbbf24;
            font-size: 16px;
            margin-bottom: 8px;
        }
        #xp-gain {
            color: #a78bfa;
            font-size: 14px;
            margin-bottom: 20px;
        }
        #continue-btn {
            padding: 12px 35px;
            font-size: 16px;
            background: linear-gradient(to bottom, #4a9fff, #2563eb);
            color: #fff;
            border: 2px solid #1d4ed8;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Level Up Overlay */
        #levelup-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 500;
        }
        #levelup-overlay.active {
            display: flex;
        }
        #levelup-title {
            color: #fbbf24;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 0 15px #fbbf24;
        }
        #levelup-char {
            color: #a78bfa;
            font-size: 18px;
            margin-bottom: 10px;
        }
        #levelup-stats {
            color: #fff;
            font-size: 13px;
            text-align: center;
            margin-bottom: 15px;
        }
        #levelup-stats div {
            margin: 4px 0;
        }
        #levelup-btn {
            padding: 12px 35px;
            font-size: 16px;
            background: linear-gradient(to bottom, #fbbf24, #d97706);
            color: #000;
            border: 2px solid #92400e;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Damage/Heal Numbers */
        .floating-number {
            position: absolute;
            font-weight: bold;
            font-size: 16px;
            text-shadow: 2px 2px 3px #000;
            animation: floatUp 1s ease-out forwards;
            pointer-events: none;
            z-index: 1000;
        }
        .floating-number.damage { color: #ef4444; }
        .floating-number.heal { color: #22c55e; }
        .floating-number.crit { color: #fbbf24; font-size: 20px; }
        .floating-number.lp { color: #22d3ee; }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-40px); }
        }

        /* Damage Flash */
        .damage-flash {
            animation: damageFlash 0.3s ease;
        }
        @keyframes damageFlash {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(2) saturate(0); }
        }

        /* Element indicators */
        .element-vital { border-color: #22c55e !important; }
        .element-thermal { border-color: #f97316 !important; }
        .element-aetheric { border-color: #a855f7 !important; }
    </style>
</head>
<body>
    <div id="game">
        <!-- Dialog Scene -->
        <div id="dialog-scene" class="active">
            <div id="sprite-left" class="dialog-sprite">
                <div class="dialog-sprite-face">
                    <div class="dialog-sprite-eyes">
                        <div class="dialog-sprite-eye"></div>
                        <div class="dialog-sprite-eye"></div>
                    </div>
                    <div class="dialog-sprite-mouth"></div>
                </div>
                <div class="dialog-sprite-label">Silas</div>
            </div>
            <div id="sprite-right" class="dialog-sprite">
                <div class="dialog-sprite-face">
                    <div class="dialog-sprite-eyes">
                        <div class="dialog-sprite-eye"></div>
                        <div class="dialog-sprite-eye"></div>
                    </div>
                    <div class="dialog-sprite-mouth"></div>
                </div>
                <div class="dialog-sprite-label">Corra</div>
            </div>
            <div id="dialog-box">
                <div id="dialog-speaker">Silas</div>

    <script>
        // ==================== CONSTANTS ====================
        const MAX_LP = 100;
        const STARTING_LP = 50;
        const LP_REGEN_PER_TURN = 5;
        const BASE_CRIT_CHANCE = 0.05;
        const CRIT_MULTIPLIER = 1.5;
        const GUARD_DAMAGE_MULT = 0.5;
        const GUARD_LP_BONUS = 10;

        // Elemental system
        const ELEMENTS = { VITAL: 'vital', THERMAL: 'thermal', AETHERIC: 'aetheric', NONE: 'none' };
        const ELEMENT_CHART = {
            vital:    { vital: 1.0, thermal: 1.5, aetheric: 0.5 },
            thermal:  { vital: 0.5, thermal: 1.0, aetheric: 1.5 },
            aetheric: { vital: 1.5, thermal: 0.5, aetheric: 1.0 },
            none:     { vital: 1.0, thermal: 1.0, aetheric: 1.0 }
        };

        // XP Table
        const XP_TABLE = [0, 100, 250, 450, 700, 1000, 1350, 1750, 2200, 2700];

        // ==================== CHARACTER DEFINITIONS ====================
        const CHARACTER_TEMPLATES = {
            silas: {

                ]
            },
            corra: {
                name: 'Corra',
                role: 'Tank/Support',
                baseStats: { hp: 120, atk: 8, def: 14, tap: 10, spd: 7 },
                growth: { hp: 12, atk: 1, def: 2, tap: 1, spd: 1 },
                element: ELEMENTS.VITAL,
                skills: [
                    { id: 'mend_weave', name: 'Mend-Weave', lpCost: 20, type: 'heal', baseHeal: 20, tapMod: 1.2, target: 'ally' },
                    { id: 'thread_hold', name: 'Thread-Hold', lpCost: 25, type: 'buff', effect: 'taunt', duration: 2, target: 'self' },
                    { id: 'interpose', name: 'Interpose', lpCost: 15, type: 'buff', effect: 'interpose', duration: 1, target: 'ally' }
                ]
            },
            vesk: {
                name: 'Vesk',
                role: 'Damage',
                baseStats: { hp: 95, atk: 15, def: 7, tap: 13, spd: 10 },
                growth: { hp: 9, atk: 2, def: 1, tap: 2, spd: 1 },
                element: ELEMENTS.THERMAL,
                skills: [
                    { id: 'flare_strike', name: 'Flare Strike', lpCost: 15, type: 'damage', multiplier: 1.5, element: ELEMENTS.THERMAL, target: 'enemy' },
                    { id: 'burnout_surge', name: 'Burnout Surge', lpCost: 30, type: 'damage', multiplier: 2.5, element: ELEMENTS.THERMAL, target: 'enemy' }
                ]
            },
            echo: {
                name: 'Echo',
                role: 'Support/Debuff',
                baseStats: { hp: 70, atk: 6, def: 9, tap: 16, spd: 12 },
                growth: { hp: 6, atk: 1, def: 1, tap: 3, spd: 2 },
                element: ELEMENTS.AETHERIC,
                skills: [
                    { id: 'fracture_song', name: 'Fracture Song', lpCost: 15, type: 'debuff', effect: 'def_down', duration: 3, target: 'enemy' },
                    { id: 'whisper_touch', name: 'Whisper-Touch', lpCost: 20, type: 'heal_all', baseHeal: 8, tapMod: 1.0 },
                    { id: 'voice_before', name: 'The Voice Before', lpCost: 25, type: 'buff', effect: 'weakness_revealed', duration: 1, target: 'ally' }
                ]
            }
        };

        // ==================== ENEMY DEFINITIONS ====================
        const ENEMY_TEMPLATES = {
            leyrat: {
                name: 'Ley-Rat Swarm',
                hp: 40, atk: 8, def: 4, tap: 5, spd: 9,
                xp: 20, gold: 15,
                element: ELEMENTS.NONE,
                cssClass: 'enemy-leyrat',
                ai: 'leyrat'
            },
            cordwork: {
                name: 'Frayed Cordwork',
                hp: 55, atk: 10, def: 6, tap: 8, spd: 6,
                xp: 30, gold: 25,
                element: ELEMENTS.AETHERIC,
                cssClass: 'enemy-cordwork',
                ai: 'cordwork'
            },
            scout: {
                name: 'Veinkeeper Scout',
                hp: 50, atk: 12, def: 5, tap: 10, spd: 10,
                xp: 40, gold: 40,
                element: ELEMENTS.THERMAL,
                cssClass: 'enemy-scout',
                ai: 'scout',
                skills: [{ id: 'sear', name: 'Sear', multiplier: 1.5, element: ELEMENTS.THERMAL }]
            },
            wisp: {
                name: 'Node Wisp',
                hp: 35, atk: 6, def: 3, tap: 14, spd: 11,
                xp: 35, gold: 30,
                element: ELEMENTS.AETHERIC,
                cssClass: 'enemy-wisp',
                ai: 'wisp',
                skills: [{ id: 'null_pulse', name: 'Null Pulse', lpDrain: 10 }]
            }
        };

        // ==================== GAME STATE ====================
        const game = {
            currentScene: 'dialog',
            dialogIndex: 0,
            dialogQueue: null,
            dialogCallback: null,

            // Party state
            party: [],
            partyLevel: 1,
            partyXP: 0,
            gold: 0,
            lp: STARTING_LP,

            // Exploration
            playerPos: { x: 0, y: 0 },
            mapEnemies: [],
            joystick: { active: false, dx: 0, dy: 0 },

            // Combat state
            combatActive: false,
            turnOrder: [],
            currentTurnIndex: 0,
            enemies: [],
            pendingAction: null,
            selectedSkill: null,
            combatTurnCount: 0,

            // Level up queue
            levelUpQueue: []
        };

        // ==================== DIALOG SCRIPTS ====================
        const introDialog = [
            { speaker: 'Silas', text: 'The threads grow thin here. Can you feel it?' },
            { speaker: 'Corra', text: 'The Vein is restless. We should proceed with caution.' },
            { speaker: 'Silas', text: 'Our party shares a pool of Ley Power - use it wisely.' },
            { speaker: 'Corra', text: 'Each action in combat follows the turn order based on Speed.' },
            { speaker: 'Silas', text: 'Strike for physical damage. Tap skills cost LP but are powerful.' },
            { speaker: 'Corra', text: 'Guard to reduce damage and restore LP to the pool.' },
            { speaker: 'Silas', text: 'Let\'s move. The creatures of the Hollow Vein await.' }
        ];

        const allClearedDialog = [
            { speaker: 'Corra', text: 'The area is clear. We\'ve done well.' },
            { speaker: 'Silas', text: 'But this is only the beginning. The Node calls to us still.' },
            { speaker: 'Corra', text: 'Thank you for playing this demo of The Loom of Ashveld.' }
        ];

        // ==================== INITIALIZATION ====================
        function initParty() {
            game.party = ['silas', 'corra', 'vesk', 'echo'].map(id => {
                const template = CHARACTER_TEMPLATES[id];
                return {
                    id,
                    name: template.name,
                    role: template.role,
                    level: 1,
                    element: template.element,
                    skills: [...template.skills],
                    ...JSON.parse(JSON.stringify(template.baseStats)),
                    maxHp: template.baseStats.hp,
                    currentHp: template.baseStats.hp,
                    statusEffects: [],
                    guarding: false,
                    damageDealt: 0,
                    healingDone: 0,
                    alive: true
                };
            });
        }

        function initMapEnemies() {
            game.mapEnemies = [
                { ...ENEMY_TEMPLATES.leyrat, id: 0, x: 0, y: 0, alive: true },
                { ...ENEMY_TEMPLATES.leyrat, id: 1, x: 0, y: 0, alive: true },
                { ...ENEMY_TEMPLATES.cordwork, id: 2, x: 0, y: 0, alive: true },
                { ...ENEMY_TEMPLATES.wisp, id: 3, x: 0, y: 0, alive: true }
            ];
        }

        // ==================== UTILITY FUNCTIONS ====================
        function randomVariance() {
            return 0.9 + Math.random() * 0.2; // 0.9 to 1.1
        }

        function getElementModifier(attackElement, targetElement) {
            if (!attackElement || attackElement === ELEMENTS.NONE) return 1.0;
            if (!targetElement || targetElement === ELEMENTS.NONE) return 1.0;
            return ELEMENT_CHART[attackElement][targetElement] || 1.0;
        }

        function rollCrit(bonus = 0) {
            return Math.random() < (BASE_CRIT_CHANCE + bonus);
        }

        function getXPForLevel(level) {
            return XP_TABLE[Math.min(level, XP_TABLE.length - 1)] || XP_TABLE[XP_TABLE.length - 1];
        }

        // ==================== DAMAGE FORMULAS ====================
        function calcPhysicalDamage(attacker, defender, weaponMod = 1.0) {
            const baseDamage = (attacker.atk * 2) - defender.def;
            let finalDamage = Math.max(1, Math.floor(baseDamage * weaponMod * randomVariance()));

            const isCrit = rollCrit();
            if (isCrit) {
                finalDamage = Math.floor(finalDamage * CRIT_MULTIPLIER);
            }

            // Apply DEF down debuff
            const defDown = defender.statusEffects?.find(s => s.effect === 'def_down');
            if (defDown) {
                finalDamage = Math.floor(finalDamage * 1.25);
            }

            return { damage: finalDamage, crit: isCrit };
        }

        function calcSkillDamage(attacker, defender, skill) {
            const baseDamage = (attacker.tap * skill.multiplier) - (defender.def * 0.5);
            let finalDamage = Math.max(1, Math.floor(baseDamage * randomVariance()));

            // Elemental modifier
            const elemMod = getElementModifier(skill.element, defender.element);
            finalDamage = Math.floor(finalDamage * elemMod);

            // Crit check - auto crit if target has weakness_revealed
            const hasWeaknessRevealed = attacker.statusEffects?.find(s => s.effect === 'weakness_revealed');
            const isCrit = hasWeaknessRevealed || rollCrit();
            if (isCrit) {
                finalDamage = Math.floor(finalDamage * CRIT_MULTIPLIER);
            }

            // Remove weakness_revealed after use
            if (hasWeaknessRevealed) {
                attacker.statusEffects = attacker.statusEffects.filter(s => s.effect !== 'weakness_revealed');
            }

            return { damage: finalDamage, crit: isCrit, elemMod };
        }

        function calcHeal(caster, skill) {
            return Math.floor(skill.baseHeal + (caster.tap * skill.tapMod));
        }

        // ==================== TURN ORDER ====================
        function calculateInitiative(entity) {
            return entity.spd + Math.floor(Math.random() * 6); // SPD + Random(0-5)
        }

        function buildTurnOrder() {
            const entities = [];

            // Add alive party members
            game.party.forEach(char => {
                if (char.alive) {
                    entities.push({ type: 'party', entity: char, initiative: calculateInitiative(char) });
                }
            });

            // Add alive enemies
            game.enemies.forEach(enemy => {
                if (enemy.currentHp > 0) {
                    entities.push({ type: 'enemy', entity: enemy, initiative: calculateInitiative(enemy) });
                }
            });

            // Sort by initiative descending, party before enemies on tie
            entities.sort((a, b) => {
                if (b.initiative !== a.initiative) return b.initiative - a.initiative;
                if (a.type === 'party' && b.type === 'enemy') return -1;
                if (a.type === 'enemy' && b.type === 'party') return 1;
                return a.entity.name.localeCompare(b.entity.name);
            });

            game.turnOrder = entities;
            game.currentTurnIndex = 0;
        }

        // ==================== STATUS EFFECTS ====================
        function applyStatusEffect(target, effect, duration, source) {
            // Check max effects (4)
            if (target.statusEffects.length >= 4) {
                target.statusEffects.shift(); // Remove oldest
            }

            // Refresh if same effect exists
            const existing = target.statusEffects.find(s => s.effect === effect);
            if (existing) {
                existing.duration = duration;
            } else {
                target.statusEffects.push({ effect, duration, source });
            }
        }

        function processStatusEffects(entity) {
            const messages = [];

            entity.statusEffects = entity.statusEffects.filter(status => {
                // Process burn
                if (status.effect === 'burn') {
                    const burnDamage = Math.floor(entity.maxHp * 0.05);
                    entity.currentHp = Math.max(0, entity.currentHp - burnDamage);
                    messages.push(`${entity.name} takes ${burnDamage} burn damage!`);
                }

                status.duration--;
                return status.duration > 0;
            });

            return messages;
        }

        function tickStatusDurations(entity) {
            entity.statusEffects = entity.statusEffects.filter(s => s.duration > 0);
        }

        // ==================== COMBAT ACTIONS ====================
        function performStrike(attacker, target) {
            const result = calcPhysicalDamage(attacker, target);

            // Apply guarding
            if (target.guarding) {
                result.damage = Math.floor(result.damage * GUARD_DAMAGE_MULT);
            }

            target.currentHp = Math.max(0, target.currentHp - result.damage);
            attacker.damageDealt = (attacker.damageDealt || 0) + result.damage;

            return result;
        }

        function performSkill(caster, skill, target) {
            if (game.lp < skill.lpCost) {
                return { success: false, message: 'Not enough LP!' };
            }

            game.lp -= skill.lpCost;

            switch (skill.type) {
                case 'damage': {
                    const result = calcSkillDamage(caster, target, skill);
                    if (target.guarding) {
                        result.damage = Math.floor(result.damage * GUARD_DAMAGE_MULT);
                    }
                    target.currentHp = Math.max(0, target.currentHp - result.damage);
                    caster.damageDealt = (caster.damageDealt || 0) + result.damage;
                    return { success: true, ...result, type: 'damage' };
                }

                case 'heal': {
                    const healAmount = calcHeal(caster, skill);
                    const actualHeal = Math.min(healAmount, target.maxHp - target.currentHp);
                    target.currentHp += actualHeal;
                    caster.healingDone = (caster.healingDone || 0) + actualHeal;
                    return { success: true, heal: actualHeal, type: 'heal' };
                }

                case 'heal_all': {
                    const healAmount = calcHeal(caster, skill);
                    let totalHeal = 0;
                    game.party.forEach(char => {
                        if (char.alive) {
                            const actualHeal = Math.min(healAmount, char.maxHp - char.currentHp);
                            char.currentHp += actualHeal;
                            totalHeal += actualHeal;
                        }
                    });
                    caster.healingDone = (caster.healingDone || 0) + totalHeal;
                    return { success: true, heal: totalHeal, type: 'heal_all' };
                }

                case 'buff': {
                    applyStatusEffect(target, skill.effect, skill.duration, caster.name);
                    return { success: true, type: 'buff', effect: skill.effect };
                }

                case 'debuff': {
                    applyStatusEffect(target, skill.effect, skill.duration, caster.name);
                    return { success: true, type: 'debuff', effect: skill.effect };
                }

                default:
                    return { success: false, message: 'Unknown skill type' };
            }
        }

        function performGuard(entity) {
            entity.guarding = true;
            game.lp = Math.min(MAX_LP, game.lp + GUARD_LP_BONUS);
            return { lpGained: GUARD_LP_BONUS };
        }

        // ==================== ENEMY AI ====================
        function getEnemyAction(enemy) {
            const aliveParty = game.party.filter(c => c.alive);
            if (aliveParty.length === 0) return null;

            // Calculate threat for each party member
            aliveParty.forEach(char => {
                char.threatScore = (char.damageDealt * 2) + (char.healingDone * 1.5) +
                    ((char.currentHp / char.maxHp) * 10);
            });

            const lowestHp = [...aliveParty].sort((a, b) => a.currentHp - b.currentHp)[0];
            const highestThreat = [...aliveParty].sort((a, b) => b.threatScore - a.threatScore)[0];
            const highestTap = [...aliveParty].sort((a, b) => b.tap - a.tap)[0];
            const randomTarget = aliveParty[Math.floor(Math.random() * aliveParty.length)];

            switch (enemy.ai) {
                case 'leyrat':
                    // Target lowest HP if any < 30%, else random
                    if (lowestHp.currentHp / lowestHp.maxHp < 0.3) {
                        return { action: 'strike', target: lowestHp };
                    }
                    return { action: 'strike', target: randomTarget };

                case 'cordwork':
                    // Turn cycle: strike, strike, desperate grab
                    enemy.turnCounter = (enemy.turnCounter || 0) + 1;
                    if (enemy.turnCounter % 3 === 0) {
                        return { action: 'strike', target: highestThreat, special: 'Desperate Grab' };
                    }
                    return { action: 'strike', target: randomTarget };

                case 'scout':
                    // Use Sear if available and target has thermal weakness
                    const thermalWeak = aliveParty.find(c => c.element === ELEMENTS.AETHERIC);
                    if (thermalWeak && enemy.skills) {
                        return { action: 'skill', skill: enemy.skills[0], target: thermalWeak };
                    }
                    return { action: 'strike', target: randomTarget };

                case 'wisp':
                    // Drain LP if party has > 50, else attack highest TAP
                    if (game.lp > 50 && enemy.skills) {
                        return { action: 'skill', skill: enemy.skills[0], target: highestTap };
                    }
                    return { action: 'strike', target: highestTap };

                default:
                    return { action: 'strike', target: randomTarget };
            }
        }

        // ==================== COMBAT FLOW ====================
        function startCombat(enemyIndices) {
            game.currentScene = 'combat';
            game.combatActive = true;
            game.combatTurnCount = 0;

            // Reset combat stats
            game.party.forEach(char => {
                char.guarding = false;
                char.damageDealt = 0;
                char.healingDone = 0;
            });

            // Initialize enemies
            game.enemies = enemyIndices.map((idx, i) => {
                const template = game.mapEnemies[idx];
                return {
                    ...template,
                    combatId: i,
                    currentHp: template.hp,
                    maxHp: template.hp,
                    statusEffects: [],
                    guarding: false,
                    turnCounter: 0
                };
            });

            // Build turn order
            buildTurnOrder();

            // Update UI
            updateCombatUI();
            showCombatScene();
            combatLog.textContent = 'Battle begins!';

            // Start first turn
            setTimeout(() => processNextTurn(), 800);
        }

        function processNextTurn() {
            if (!game.combatActive) return;

            // Check victory/defeat
            if (game.enemies.every(e => e.currentHp <= 0)) {
                endCombat(true);
                return;
            }
            if (game.party.every(c => !c.alive)) {
                endCombat(false);
                return;
            }

            // Get current turn entity
            if (game.currentTurnIndex >= game.turnOrder.length) {
                // New round - rebuild turn order
                buildTurnOrder();
                game.combatTurnCount++;
            }

            const current = game.turnOrder[game.currentTurnIndex];
            if (!current) {
                game.currentTurnIndex++;
                processNextTurn();
                return;
            }

            const entity = current.entity;

            // Skip dead entities
            if ((current.type === 'party' && !entity.alive) ||
                (current.type === 'enemy' && entity.currentHp <= 0)) {
                game.currentTurnIndex++;
                processNextTurn();
                return;
            }

            // Process status effects at start of turn
            const statusMessages = processStatusEffects(entity);
            if (statusMessages.length > 0) {
                combatLog.textContent = statusMessages.join(' ');
            }

            // Check if entity died from status
            if ((current.type === 'party' && entity.currentHp <= 0) ||
                (current.type === 'enemy' && entity.currentHp <= 0)) {
                if (current.type === 'party') {
                    entity.alive = false;
                }
                updateCombatUI();
                game.currentTurnIndex++;
                setTimeout(() => processNextTurn(), 600);
                return;
            }

            // Reset guarding
            entity.guarding = false;

            // LP regen for party members
            if (current.type === 'party') {
                game.lp = Math.min(MAX_LP, game.lp + LP_REGEN_PER_TURN);
            }

            updateCombatUI();

            if (current.type === 'party') {
                // Player turn - enable actions
                enablePlayerActions(entity);
            } else {
                // Enemy turn - AI decides
                setTimeout(() => executeEnemyTurn(entity), 600);
            }
        }

        function enablePlayerActions(character) {
            combatLog.textContent = `${character.name}'s turn!`;
            document.getElementById('action-label').textContent = `${character.name} - Choose action`;

            const strikeBtn = document.getElementById('strike-btn');
            const skillBtn = document.getElementById('skill-btn');
            const guardBtn = document.getElementById('guard-btn');

            strikeBtn.disabled = false;
            skillBtn.disabled = false;
            guardBtn.disabled = false;

            hideTargetSelection();
            hideSkillSelection();
            showMainActions();
        }

        function disablePlayerActions() {
            document.getElementById('strike-btn').disabled = true;
            document.getElementById('skill-btn').disabled = true;
            document.getElementById('guard-btn').disabled = true;
        }

        function executePlayerStrike(target) {
            disablePlayerActions();
            hideTargetSelection();

            const current = game.turnOrder[game.currentTurnIndex];
            const attacker = current.entity;

            const result = performStrike(attacker, target);

            let logMsg = `${attacker.name} strikes ${target.name} for ${result.damage}`;
            if (result.crit) logMsg += ' CRITICAL!';
            combatLog.textContent = logMsg;

            showFloatingNumber(target, result.damage, result.crit ? 'crit' : 'damage');
            flashElement(getEnemyElement(target.combatId));

            updateCombatUI();

            game.currentTurnIndex++;
            setTimeout(() => processNextTurn(), 800);
        }

        function executePlayerSkill(skill, target) {
            disablePlayerActions();
            hideSkillSelection();
            hideTargetSelection();

            const current = game.turnOrder[game.currentTurnIndex];
            const caster = current.entity;

            const result = performSkill(caster, skill, target);

            if (!result.success) {
                combatLog.textContent = result.message;
                enablePlayerActions(caster);
                return;
            }

            let logMsg = `${caster.name} uses ${skill.name}`;

            switch (result.type) {
                case 'damage':
                    logMsg += ` on ${target.name} for ${result.damage}`;
                    if (result.crit) logMsg += ' CRITICAL!';
                    showFloatingNumber(target, result.damage, result.crit ? 'crit' : 'damage');
                    if (target.combatId !== undefined) {
                        flashElement(getEnemyElement(target.combatId));
                    }
                    break;

                case 'heal':
                    logMsg += ` - ${target.name} healed for ${result.heal}`;
                    showFloatingNumber(target, result.heal, 'heal');
                    break;

                case 'heal_all':
                    logMsg += ` - Party healed for ${result.heal}`;
                    break;

                case 'buff':
                case 'debuff':
                    logMsg += ` on ${target.name}`;
                    break;
            }

            combatLog.textContent = logMsg;
            updateCombatUI();

            game.currentTurnIndex++;
            setTimeout(() => processNextTurn(), 800);
        }

        function executePlayerGuard() {
            disablePlayerActions();

            const current = game.turnOrder[game.currentTurnIndex];
            const entity = current.entity;

            const result = performGuard(entity);

            combatLog.textContent = `${entity.name} guards! +${result.lpGained} LP`;
            showFloatingNumber(entity, result.lpGained, 'lp');

            updateCombatUI();

            game.currentTurnIndex++;
            setTimeout(() => processNextTurn(), 800);
        }

        function executeEnemyTurn(enemy) {
            const action = getEnemyAction(enemy);
            if (!action) {
                game.currentTurnIndex++;
                processNextTurn();
                return;
            }

            switch (action.action) {
                case 'strike': {
                    const result = performStrike(enemy, action.target);
                    let logMsg = action.special ?
                        `${enemy.name} uses ${action.special} on ${action.target.name} for ${result.damage}!` :
                        `${enemy.name} strikes ${action.target.name} for ${result.damage}!`;
                    if (result.crit) logMsg += ' CRITICAL!';
                    combatLog.textContent = logMsg;

                    showFloatingNumber(action.target, result.damage, result.crit ? 'crit' : 'damage');
                    flashElement(getPartyMemberElement(action.target.id));

                    // Check if target died
                    if (action.target.currentHp <= 0) {
                        action.target.alive = false;
                    }
                    break;
                }

                case 'skill': {
                    if (action.skill.lpDrain) {
                        // LP drain skill
                        const drain = action.skill.lpDrain;
                        game.lp = Math.max(0, game.lp - drain);
                        combatLog.textContent = `${enemy.name} uses ${action.skill.name}! Party loses ${drain} LP!`;
                        showFloatingNumber(action.target, drain, 'lp');
                    } else if (action.skill.multiplier) {
                        // Damage skill
                        const result = calcSkillDamage(enemy, action.target, action.skill);
                        if (action.target.guarding) {
                            result.damage = Math.floor(result.damage * GUARD_DAMAGE_MULT);
                        }
                        action.target.currentHp = Math.max(0, action.target.currentHp - result.damage);

                        combatLog.textContent = `${enemy.name} uses ${action.skill.name} on ${action.target.name} for ${result.damage}!`;
                        showFloatingNumber(action.target, result.damage, result.crit ? 'crit' : 'damage');
                        flashElement(getPartyMemberElement(action.target.id));

                        if (action.target.currentHp <= 0) {
                            action.target.alive = false;
                        }
                    }
                    break;
                }
            }

            updateCombatUI();

            game.currentTurnIndex++;
            setTimeout(() => processNextTurn(), 1000);
        }

        function endCombat(victory) {
            game.combatActive = false;
            disablePlayerActions();

            setTimeout(() => {
                const resultEl = document.getElementById('combat-result');
                const resultText = document.getElementById('result-text');
                const rewardsText = document.getElementById('rewards-text');
                const xpGainEl = document.getElementById('xp-gain');

                resultEl.style.display = 'flex';

                if (victory) {
                    resultText.textContent = 'VICTORY!';
                    resultText.className = 'victory';

                    // Calculate rewards
                    let totalXP = 0;
                    let totalGold = 0;

                    game.enemies.forEach(enemy => {
                        // Mark map enemy as defeated
                        const mapEnemy = game.mapEnemies.find(e => e.id === enemy.id);
                        if (mapEnemy) mapEnemy.alive = false;

                        // XP formula: Enemy HP * 0.5 * level modifier
                        const baseXP = Math.floor(enemy.maxHp * 0.5);
                        totalXP += baseXP;
                        totalGold += enemy.gold;
                    });

                    game.partyXP += totalXP;
                    game.gold += totalGold;

                    rewardsText.textContent = `+${totalGold}g`;
                    xpGainEl.textContent = `+${totalXP} XP`;

                    // Check for level up
                    checkLevelUp();
                } else {
                    resultText.textContent = 'DEFEAT';
                    resultText.className = 'defeat';
                    rewardsText.textContent = '';
                    xpGainEl.textContent = '';

                    // Restore party HP on defeat
                    game.party.forEach(char => {
                        char.currentHp = char.maxHp;
                        char.alive = true;
                        char.statusEffects = [];
                    });
                }
            }, 600);
        }

        function checkLevelUp() {
            const xpNeeded = getXPForLevel(game.partyLevel);
            if (game.partyXP >= xpNeeded && game.partyLevel < 10) {
                game.partyXP -= xpNeeded;
                game.partyLevel++;

                // Level up all party members
                game.party.forEach(char => {
                    const template = CHARACTER_TEMPLATES[char.id];
                    const oldStats = { ...char };

                    char.level = game.partyLevel;
                    char.maxHp += template.growth.hp;
                    char.atk += template.growth.atk;
                    char.def += template.growth.def;
                    char.tap += template.growth.tap;
                    char.spd += template.growth.spd;
                    char.currentHp = char.maxHp; // Full heal on level up

                    game.levelUpQueue.push({ char, oldStats });
                });
            }
        }

        function showNextLevelUp() {
            if (game.levelUpQueue.length === 0) {
                document.getElementById('levelup-overlay').classList.remove('active');

                // Check if all enemies defeated
                if (game.mapEnemies.every(e => !e.alive)) {
                    showDialog(allClearedDialog, switchToExploration);
                } else {
                    switchToExploration();
                }
                return;
            }

            const levelUp = game.levelUpQueue.shift();
            const { char, oldStats } = levelUp;

            document.getElementById('levelup-char').textContent = char.name;
            document.getElementById('levelup-stats').innerHTML = `
                <div>Level: ${oldStats.level} → ${char.level}</div>
                <div>HP: ${oldStats.maxHp} → ${char.maxHp}</div>
                <div>ATK: ${oldStats.atk} → ${char.atk}</div>
                <div>DEF: ${oldStats.def} → ${char.def}</div>
                <div>TAP: ${oldStats.tap} → ${char.tap}</div>
                <div>SPD: ${oldStats.spd} → ${char.spd}</div>
            `;

            document.getElementById('levelup-overlay').classList.add('active');
        }

        // ==================== UI UPDATES ====================
        function updateCombatUI() {
            // Update turn order display
            const turnOrderEl = document.getElementById('turn-order');
            turnOrderEl.innerHTML = '';
            game.turnOrder.slice(0, 8).forEach((turn, i) => {
                const icon = document.createElement('div');
                icon.className = `turn-icon ${turn.type}`;
                if (i === game.currentTurnIndex) icon.classList.add('active');
                icon.textContent = turn.entity.name.substring(0, 2).toUpperCase();
                turnOrderEl.appendChild(icon);
            });

            // Update LP bar
            document.getElementById('lp-bar').style.width = `${(game.lp / MAX_LP) * 100}%`;
            document.getElementById('lp-label').textContent = `LP: ${game.lp} / ${MAX_LP}`;

            // Update enemies
            const enemiesArea = document.getElementById('enemies-area');
            enemiesArea.innerHTML = '';
            game.enemies.forEach(enemy => {
                const el = document.createElement('div');
                el.className = `combat-enemy ${enemy.cssClass}`;
                el.id = `combat-enemy-${enemy.combatId}`;
                if (enemy.currentHp <= 0) el.classList.add('dead');

                el.innerHTML = `
                    <div class="enemy-name-label">${enemy.name}</div>
                    <div class="enemy-face">
                        <div class="enemy-eyes">
                            <div class="enemy-eye"></div>
                            <div class="enemy-eye"></div>
                        </div>
                        <div class="enemy-mouth"></div>
                    </div>
                    <div class="enemy-hp-mini">
                        <div class="enemy-hp-mini-fill" style="width: ${(enemy.currentHp / enemy.maxHp) * 100}%"></div>
                    </div>
                `;
                enemiesArea.appendChild(el);
            });

            // Update party members
            const partyArea = document.getElementById('party-area');
            partyArea.innerHTML = '';
            game.party.forEach(char => {
                const el = document.createElement('div');
                el.className = 'party-member';
                el.id = `party-member-${char.id}`;
                if (!char.alive) el.classList.add('dead');

                const current = game.turnOrder[game.currentTurnIndex];
                if (current && current.type === 'party' && current.entity.id === char.id) {
                    el.classList.add('active-turn');
                }

                // Status icons
                let statusHtml = '';
                char.statusEffects.forEach(s => {
                    let icon = '?';
                    let color = '#888';
                    switch (s.effect) {
                        case 'atk_up': icon = '⬆'; color = '#ef4444'; break;
                        case 'taunt': icon = '🎯'; color = '#3b82f6'; break;
                        case 'def_down': icon = '⬇'; color = '#f97316'; break;
                        case 'weakness_revealed': icon = '👁'; color = '#fbbf24'; break;
                        case 'interpose': icon = '🛡'; color = '#22c55e'; break;
                    }
                    statusHtml += `<div class="status-icon" style="background:${color}">${icon}</div>`;
                });

                el.innerHTML = `
                    <div class="pm-sprite ${char.id}">
                        <div class="pm-face"></div>
                    </div>
                    <div class="pm-name">${char.name}</div>
                    <div class="pm-hp-bar">
                        <div class="pm-hp-fill" style="width: ${(char.currentHp / char.maxHp) * 100}%"></div>
                    </div>
                    <div class="pm-hp-text">${char.currentHp}/${char.maxHp}</div>
                    <div class="pm-status">${statusHtml}</div>
                `;
                partyArea.appendChild(el);
            });
        }

        function updateExplorationUI() {
            document.getElementById('hud-party-level').textContent = `Party Lv. ${game.partyLevel}`;
            document.getElementById('hud-lp').textContent = `LP: ${game.lp}/${MAX_LP}`;
            document.getElementById('hud-gold').textContent = `${game.gold}g`;

            const miniBars = document.getElementById('party-mini-bars');
            miniBars.innerHTML = '';
            game.party.forEach(char => {
                const el = document.createElement('div');
                el.className = 'mini-char';
                el.innerHTML = `
                    <div class="mini-char-name">${char.name}</div>
                    <div class="mini-hp-bar">
                        <div class="mini-hp-fill" style="width: ${(char.currentHp / char.maxHp) * 100}%"></div>
                    </div>
                `;
                miniBars.appendChild(el);
            });
        }

        // ==================== UI HELPERS ====================
        function showMainActions() {
            document.getElementById('combat-actions').style.display = 'flex';
            document.getElementById('target-selection').classList.remove('active');
            document.getElementById('skill-selection').classList.remove('active');
        }

        function hideMainActions() {
            document.getElementById('combat-actions').style.display = 'none';
        }

        function showTargetSelection(targets, callback) {
            hideMainActions();
            const container = document.getElementById('target-buttons');
            container.innerHTML = '';

            targets.forEach(target => {
                const btn = document.createElement('button');
                btn.className = 'target-btn';
                btn.textContent = target.name;
                btn.onclick = () => callback(target);
                container.appendChild(btn);
            });

            const cancelBtn = document.createElement('button');
            cancelBtn.id = 'cancel-target-btn';
            cancelBtn.className = 'target-btn';
            cancelBtn.textContent = 'Cancel';
            cancelBtn.onclick = () => {
                hideTargetSelection();
                const current = game.turnOrder[game.currentTurnIndex];
                enablePlayerActions(current.entity);
            };
            container.appendChild(cancelBtn);

            document.getElementById('target-selection').classList.add('active');
        }

        function hideTargetSelection() {
            document.getElementById('target-selection').classList.remove('active');
            showMainActions();
        }

        function showSkillSelection(character) {
            hideMainActions();
            const container = document.getElementById('skill-buttons');
            container.innerHTML = '';

            character.skills.forEach(skill => {
                const btn = document.createElement('button');
                btn.className = 'skill-select-btn';
                btn.innerHTML = `${skill.name}<br><span class="skill-lp">${skill.lpCost} LP</span>`;
                btn.disabled = game.lp < skill.lpCost;
                btn.onclick = () => {
                    game.selectedSkill = skill;
                    hideSkillSelection();

                    // Determine valid targets
                    if (skill.target === 'enemy') {
                        const targets = game.enemies.filter(e => e.currentHp > 0);
                        showTargetSelection(targets, (target) => executePlayerSkill(skill, target));
                    } else if (skill.target === 'ally') {
                        const targets = game.party.filter(c => c.alive);
                        showTargetSelection(targets, (target) => executePlayerSkill(skill, target));
                    } else if (skill.target === 'self') {
                        executePlayerSkill(skill, character);
                    } else {
                        // All party (heal_all etc)
                        executePlayerSkill(skill, null);
                    }
                };
                container.appendChild(btn);
            });

            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'skill-select-btn';
            cancelBtn.textContent = 'Cancel';
            cancelBtn.onclick = () => {
                hideSkillSelection();
                enablePlayerActions(character);
            };
            container.appendChild(cancelBtn);

            document.getElementById('skill-selection').classList.add('active');
        }

        function hideSkillSelection() {
            document.getElementById('skill-selection').classList.remove('active');
            showMainActions();
        }

        function showFloatingNumber(entity, value, type) {
            const num = document.createElement('div');
            num.className = `floating-number ${type}`;
            num.textContent = (type === 'heal' || type === 'lp') ? `+${value}` : `-${value}`;

            // Position based on entity type
            let targetEl;
            if (entity.combatId !== undefined) {
                targetEl = document.getElementById(`combat-enemy-${entity.combatId}`);
            } else if (entity.id) {
                targetEl = document.getElementById(`party-member-${entity.id}`);
            }

            if (targetEl) {
                const rect = targetEl.getBoundingClientRect();
                num.style.left = `${rect.left + rect.width / 2}px`;
                num.style.top = `${rect.top}px`;
            }

            document.body.appendChild(num);
            setTimeout(() => num.remove(), 1000);
        }

        function flashElement(el) {
            if (el) {
                el.classList.add('damage-flash');
                setTimeout(() => el.classList.remove('damage-flash'), 300);
            }
        }

        function getEnemyElement(combatId) {
            return document.getElementById(`combat-enemy-${combatId}`);
        }

        function getPartyMemberElement(charId) {
            return document.getElementById(`party-member-${charId}`);
        }

        // ==================== SCENE MANAGEMENT ====================
        function showDialog(script, callback) {
            game.dialogQueue = [...script];
            game.dialogCallback = callback;
            game.dialogIndex = 0;

            const line = game.dialogQueue[0];
            document.getElementById('dialog-speaker').textContent = line.speaker;
            document.getElementById('dialog-text').textContent = line.text;

            game.currentScene = 'dialog';
            document.getElementById('dialog-scene').classList.add('active');
            document.getElementById('exploration-scene').style.display = 'none';
            document.getElementById('combat-scene').style.display = 'none';
        }

        function advanceDialog() {
            game.dialogIndex++;

            if (game.dialogIndex >= game.dialogQueue.length) {
                document.getElementById('dialog-scene').classList.remove('active');
                if (game.dialogCallback) {
                    game.dialogCallback();
                }
                return;
            }

            const line = game.dialogQueue[game.dialogIndex];
            document.getElementById('dialog-speaker').textContent = line.speaker;
            document.getElementById('dialog-text').textContent = line.text;
        }

        function switchToExploration() {
            game.currentScene = 'exploration';
            document.getElementById('dialog-scene').classList.remove('active');
            document.getElementById('exploration-scene').style.display = 'block';
            document.getElementById('combat-scene').style.display = 'none';

            initWorld();
            updateExplorationUI();
        }

        function showCombatScene() {
            document.getElementById('dialog-scene').classList.remove('active');
            document.getElementById('exploration-scene').style.display = 'none';
            document.getElementById('combat-scene').style.display = 'block';
        }

        // ==================== EXPLORATION ====================
        function initWorld() {
            const world = document.getElementById('world');
            const enemiesContainer = document.getElementById('enemies-container');
            world.innerHTML = '';
            enemiesContainer.innerHTML = '';

            const cols = Math.ceil(window.innerWidth / 40) + 2;
            const rows = Math.ceil(window.innerHeight / 40) + 2;

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'grass-tile';
                    tile.style.left = (x * 40) + 'px';
                    tile.style.top = (y * 40) + 'px';
                    const shade = Math.random() * 15 - 7;
                    tile.style.background = `rgb(${58 + shade}, ${80 + shade}, ${50 + shade})`;
                    world.appendChild(tile);
                }
            }

            // Center player
            game.playerPos.x = window.innerWidth / 2 - 18;
            game.playerPos.y = window.innerHeight / 2 - 27;
            updatePlayerPosition();

            // Position enemies
            const positions = [
                { x: window.innerWidth * 0.2, y: window.innerHeight * 0.2 },
                { x: window.innerWidth * 0.75, y: window.innerHeight * 0.18 },
                { x: window.innerWidth * 0.15, y: window.innerHeight * 0.55 },
                { x: window.innerWidth * 0.78, y: window.innerHeight * 0.5 }
            ];

            game.mapEnemies.forEach((enemy, i) => {
                if (enemy.alive) {
                    enemy.x = positions[i].x;
                    enemy.y = positions[i].y;
                    createMapEnemy(enemy);
                }
            });
        }

        function createMapEnemy(enemy) {
            const el = document.createElement('div');
            el.className = `enemy-map ${enemy.cssClass}`;
            el.id = `map-enemy-${enemy.id}`;
            el.innerHTML = `
                <div class="enemy-face">
                    <div class="enemy-eyes">
                        <div class="enemy-eye"></div>
                        <div class="enemy-eye"></div>
                    </div>
                    <div class="enemy-mouth"></div>
                </div>
            `;
            el.style.left = enemy.x + 'px';
            el.style.top = enemy.y + 'px';
            document.getElementById('enemies-container').appendChild(el);
        }

        function updatePlayerPosition() {
            const player = document.getElementById('player');
            player.style.left = game.playerPos.x + 'px';
            player.style.top = game.playerPos.y + 'px';
        }

        function checkEnemyCollision() {
            const px = game.playerPos.x + 18;
            const py = game.playerPos.y + 27;

            for (let i = 0; i < game.mapEnemies.length; i++) {
                const enemy = game.mapEnemies[i];
                if (!enemy.alive) continue;

                const ex = enemy.x + 22;
                const ey = enemy.y + 22;
                const dist = Math.sqrt((px - ex) ** 2 + (py - ey) ** 2);

                if (dist < 45) {
                    return [i];
                }
            }
            return null;
        }

        // ==================== JOYSTICK CONTROLS ====================
        function handleJoystickStart(e) {
            e.preventDefault();
            game.joystick.active = true;
            handleJoystickMove(e);
        }

        function handleJoystickMove(e) {
            if (!game.joystick.active) return;
            e.preventDefault();

            const joystickArea = document.getElementById('joystick-area');
            const joystickKnob = document.getElementById('joystick-knob');
            const rect = joystickArea.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            let dx = clientX - centerX;
            let dy = clientY - centerY;

            const maxDist = 30;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            joystickKnob.style.left = `calc(50% + ${dx}px)`;
            joystickKnob.style.top = `calc(50% + ${dy}px)`;

            game.joystick.dx = dx / maxDist;
            game.joystick.dy = dy / maxDist;
        }

        function handleJoystickEnd(e) {
            e.preventDefault();
            game.joystick.active = false;
            game.joystick.dx = 0;
            game.joystick.dy = 0;

            const joystickKnob = document.getElementById('joystick-knob');
            joystickKnob.style.left = '50%';
            joystickKnob.style.top = '50%';
        }

        // ==================== GAME LOOP ====================
        function gameLoop() {
            if (game.currentScene === 'exploration' && game.joystick.active) {
                const speed = 4;
                game.playerPos.x += game.joystick.dx * speed;
                game.playerPos.y += game.joystick.dy * speed;

                game.playerPos.x = Math.max(0, Math.min(window.innerWidth - 36, game.playerPos.x));
                game.playerPos.y = Math.max(80, Math.min(window.innerHeight - 54, game.playerPos.y));

                updatePlayerPosition();

                // Check for enemy collision
                const enemyIndices = checkEnemyCollision();
                if (enemyIndices) {
                    game.joystick.active = false;
                    startCombat(enemyIndices);
                }
            }
            requestAnimationFrame(gameLoop);
        }

        // ==================== EVENT LISTENERS ====================
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize game
            initParty();
            initMapEnemies();
            game.lp = STARTING_LP;

            // Start with intro dialog
            showDialog(introDialog, switchToExploration);

            // Dialog handlers
            const dialogScene = document.getElementById('dialog-scene');
            dialogScene.addEventListener('click', advanceDialog);
            dialogScene.addEventListener('touchend', (e) => {
                e.preventDefault();
                advanceDialog();
            });

            // Joystick handlers
            const joystickArea = document.getElementById('joystick-area');
            joystickArea.addEventListener('touchstart', handleJoystickStart, { passive: false });
            joystickArea.addEventListener('touchmove', handleJoystickMove, { passive: false });
            joystickArea.addEventListener('touchend', handleJoystickEnd, { passive: false });
            joystickArea.addEventListener('mousedown', handleJoystickStart);
            document.addEventListener('mousemove', handleJoystickMove);
            document.addEventListener('mouseup', handleJoystickEnd);

            // Combat buttons
            document.getElementById('strike-btn').addEventListener('click', () => {
                const current = game.turnOrder[game.currentTurnIndex];
                if (current && current.type === 'party') {
                    const targets = game.enemies.filter(e => e.currentHp > 0);
                    showTargetSelection(targets, executePlayerStrike);
                }
            });

            document.getElementById('skill-btn').addEventListener('click', () => {
                const current = game.turnOrder[game.currentTurnIndex];
                if (current && current.type === 'party') {
                    showSkillSelection(current.entity);
                }
            });

            document.getElementById('guard-btn').addEventListener('click', executePlayerGuard);

            // Continue button
            document.getElementById('continue-btn').addEventListener('click', () => {
                document.getElementById('combat-result').style.display = 'none';

                if (game.levelUpQueue.length > 0) {
                    showNextLevelUp();
                } else if (game.mapEnemies.every(e => !e.alive)) {
                    showDialog(allClearedDialog, switchToExploration);
                } else {
                    switchToExploration();
                }
            });

            // Level up button
            document.getElementById('levelup-btn').addEventListener('click', showNextLevelUp);

            // Start game loop
            gameLoop();

            // Combat log element reference
            window.combatLog = document.getElementById('combat-log');
        });
    </script>
</body>

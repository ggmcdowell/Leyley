<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Leyley</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }
        body {
            background-color: #1a1a2e;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        #game {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Dialog Scene */
        #dialog-scene {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #2d132c 0%, #1a1a2e 100%);
        }
        .sprite {
            position: absolute;
            bottom: 180px;
            width: 80px;
            height: 120px;
            border-radius: 8px;
        }
        #sprite-left {
            left: 15%;
            background: linear-gradient(to bottom, #4a9fff 0%, #2563eb 100%);
            border: 3px solid #1d4ed8;
        }
        #sprite-right {
            right: 15%;
            background: linear-gradient(to bottom, #f472b6 0%, #db2777 100%);
            border: 3px solid #be185d;
        }
        .sprite-face {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
        }
        .sprite-eyes {
            position: absolute;
            top: 15px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        .sprite-eye {
            width: 8px;
            height: 8px;
            background: #333;
            border-radius: 50%;
        }
        .sprite-mouth {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 15px;
            height: 6px;
            background: #333;
            border-radius: 0 0 10px 10px;
        }
        .sprite-label {
            position: absolute;
            bottom: -25px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
        }
        #dialog-box {
            position: absolute;
            bottom: 20px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid #4a9fff;
            border-radius: 12px;
            padding: 15px;
            min-height: 120px;
        }
        #dialog-speaker {
            color: #4a9fff;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }
        #dialog-text {
            color: #fff;
            font-size: 16px;
            line-height: 1.4;
        }
        #dialog-continue {
            position: absolute;
            bottom: 10px;
            right: 15px;
            color: #888;
            font-size: 12px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Exploration Scene */
        #exploration-scene {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #2d5a27;
            display: none;
        }
        #world {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .grass-tile {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #3a7d32;
            border: 1px solid #2d5a27;
        }
        #player {
            position: absolute;
            width: 40px;
            height: 60px;
            background: linear-gradient(to bottom, #4a9fff 0%, #2563eb 100%);
            border: 2px solid #1d4ed8;
            border-radius: 6px;
            z-index: 100;
            transition: left 0.05s, top 0.05s;
        }
        #player .sprite-face {
            width: 30px;
            height: 30px;
            top: 8px;
        }
        #player .sprite-eyes {
            top: 8px;
            gap: 8px;
        }
        #player .sprite-eye {
            width: 5px;
            height: 5px;
        }
        #player .sprite-mouth {
            bottom: 6px;
            width: 10px;
            height: 4px;
        }

        /* Enemy on map */
        #enemy-map {
            position: absolute;
            width: 50px;
            height: 50px;
            background: linear-gradient(to bottom, #ef4444 0%, #b91c1c 100%);
            border: 3px solid #7f1d1d;
            border-radius: 50%;
            z-index: 99;
        }
        #enemy-map .enemy-face {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 20px;
        }
        #enemy-map .enemy-eyes {
            display: flex;
            justify-content: space-between;
            padding: 0 2px;
        }
        #enemy-map .enemy-eye {
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
        }
        #enemy-map .enemy-mouth {
            width: 20px;
            height: 8px;
            background: #000;
            margin: 4px auto 0;
            border-radius: 0 0 10px 10px;
        }

        /* Virtual Joystick */
        #joystick-area {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            z-index: 200;
        }
        #joystick-knob {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 201;
        }

        /* Scene indicator */
        #scene-label {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            z-index: 300;
        }

        /* Combat Scene */
        #combat-scene {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #1a1a2e 0%, #0f0f1a 100%);
            display: none;
        }
        #combat-background {
            position: absolute;
            width: 100%;
            height: 50%;
            top: 0;
            background: linear-gradient(to bottom, #2d1b4e 0%, #1a1a2e 100%);
            border-bottom: 3px solid #4a3b6b;
        }
        #combat-enemy {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            background: linear-gradient(to bottom, #ef4444 0%, #b91c1c 100%);
            border: 4px solid #7f1d1d;
            border-radius: 50%;
        }
        #combat-enemy .enemy-face {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 50px;
        }
        #combat-enemy .enemy-eyes {
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
        }
        #combat-enemy .enemy-eye {
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
        }
        #combat-enemy .enemy-mouth {
            width: 50px;
            height: 20px;
            background: #000;
            margin: 8px auto 0;
            border-radius: 0 0 20px 20px;
        }
        #enemy-name {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 18px;
            font-weight: bold;
        }

        /* Health Bars */
        .health-bar-container {
            position: absolute;
            width: 80%;
            left: 10%;
            height: 24px;
            background: #333;
            border-radius: 12px;
            border: 2px solid #555;
            overflow: hidden;
        }
        .health-bar {
            height: 100%;
            transition: width 0.3s ease;
            border-radius: 10px;
        }
        .health-bar-label {
            position: absolute;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            line-height: 24px;
            text-shadow: 1px 1px 2px #000;
        }
        #enemy-health-container {
            top: 42%;
        }
        #enemy-health {
            background: linear-gradient(to right, #ef4444, #f87171);
        }
        #player-health-container {
            bottom: 180px;
        }
        #player-health {
            background: linear-gradient(to right, #22c55e, #4ade80);
        }

        /* Combat UI */
        #combat-ui {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 160px;
            background: rgba(0, 0, 0, 0.9);
            border-top: 3px solid #4a9fff;
            padding: 15px;
        }
        #player-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        #player-name-combat {
            color: #4a9fff;
            font-size: 16px;
            font-weight: bold;
        }
        #player-hp-text {
            color: #22c55e;
            font-size: 14px;
        }
        #combat-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .combat-btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.1s;
        }
        .combat-btn:active {
            transform: scale(0.95);
        }
        .combat-btn:disabled {
            opacity: 0.5;
        }
        #attack-btn {
            background: linear-gradient(to bottom, #ef4444, #b91c1c);
            color: #fff;
            border: 2px solid #7f1d1d;
        }
        #defend-btn {
            background: linear-gradient(to bottom, #3b82f6, #1d4ed8);
            color: #fff;
            border: 2px solid #1e40af;
        }

        /* Combat Log */
        #combat-log {
            position: absolute;
            top: 52%;
            left: 10%;
            right: 10%;
            text-align: center;
            color: #fbbf24;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            min-height: 24px;
        }

        /* Damage Flash */
        .damage-flash {
            animation: damageFlash 0.3s ease;
        }
        @keyframes damageFlash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Victory/Defeat overlay */
        #combat-result {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 400;
        }
        #result-text {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        #result-text.victory {
            color: #22c55e;
        }
        #result-text.defeat {
            color: #ef4444;
        }
        #continue-btn {
            padding: 15px 40px;
            font-size: 18px;
            background: linear-gradient(to bottom, #4a9fff, #2563eb);
            color: #fff;
            border: 2px solid #1d4ed8;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="game">
        <!-- Dialog Scene -->
        <div id="dialog-scene">
            <div id="sprite-left" class="sprite">
                <div class="sprite-face">
                    <div class="sprite-eyes">
                        <div class="sprite-eye"></div>
                        <div class="sprite-eye"></div>
                    </div>
                    <div class="sprite-mouth"></div>
                </div>
                <div class="sprite-label">Ley</div>
            </div>
            <div id="sprite-right" class="sprite">
                <div class="sprite-face">
                    <div class="sprite-eyes">
                        <div class="sprite-eye"></div>
                        <div class="sprite-eye"></div>
                    </div>
                    <div class="sprite-mouth"></div>
                </div>
                <div class="sprite-label">Mira</div>
            </div>
            <div id="dialog-box">
                <div id="dialog-speaker">Ley</div>
                <div id="dialog-text">Hello there! Welcome to our world.</div>
                <div id="dialog-continue">tap to continue</div>
            </div>
        </div>

        <!-- Exploration Scene -->
        <div id="exploration-scene">
            <div id="world"></div>
            <div id="player">
                <div class="sprite-face">
                    <div class="sprite-eyes">
                        <div class="sprite-eye"></div>
                        <div class="sprite-eye"></div>
                    </div>
                    <div class="sprite-mouth"></div>
                </div>
            </div>
            <div id="enemy-map">
                <div class="enemy-face">
                    <div class="enemy-eyes">
                        <div class="enemy-eye"></div>
                        <div class="enemy-eye"></div>
                    </div>
                    <div class="enemy-mouth"></div>
                </div>
            </div>
            <div id="joystick-area">
                <div id="joystick-knob"></div>
            </div>
        </div>

        <!-- Combat Scene -->
        <div id="combat-scene">
            <div id="combat-background"></div>
            <div id="enemy-name">Slime</div>
            <div id="combat-enemy">
                <div class="enemy-face">
                    <div class="enemy-eyes">
                        <div class="enemy-eye"></div>
                        <div class="enemy-eye"></div>
                    </div>
                    <div class="enemy-mouth"></div>
                </div>
            </div>
            <div id="enemy-health-container" class="health-bar-container">
                <div id="enemy-health" class="health-bar" style="width: 100%"></div>
                <div id="enemy-health-label" class="health-bar-label">50 / 50</div>
            </div>
            <div id="combat-log"></div>
            <div id="player-health-container" class="health-bar-container">
                <div id="player-health" class="health-bar" style="width: 100%"></div>
                <div id="player-health-label" class="health-bar-label">100 / 100</div>
            </div>
            <div id="combat-ui">
                <div id="player-stats">
                    <div id="player-name-combat">Ley</div>
                    <div id="player-hp-text">HP: 100 / 100</div>
                </div>
                <div id="combat-actions">
                    <button id="attack-btn" class="combat-btn">Attack</button>
                    <button id="defend-btn" class="combat-btn">Defend</button>
                </div>
            </div>
            <div id="combat-result">
                <div id="result-text"></div>
                <button id="continue-btn">Continue</button>
            </div>
        </div>

        <div id="scene-label"></div>
    </div>

    <script>
        // Game State
        const game = {
            currentScene: 'dialog',
            dialogIndex: 0,
            player: {
                x: 0,
                y: 0,
                hp: 100,
                maxHp: 100,
                attack: 15,
                defense: 5,
                defending: false
            },
            enemy: {
                x: 0,
                y: 0,
                hp: 50,
                maxHp: 50,
                attack: 12,
                alive: true
            },
            joystick: { active: false, dx: 0, dy: 0 },
            combatTurn: 'player',
            combatActive: false
        };

        // Dialog Data
        const dialogScript = [
            { speaker: 'Ley', text: 'Hello there! Welcome to our world.' },
            { speaker: 'Mira', text: 'Oh, a new visitor! How exciting!' },
            { speaker: 'Ley', text: 'This is just a test scene to make sure everything works.' },
            { speaker: 'Mira', text: 'Watch out for the red slime on the map!' },
            { speaker: 'Ley', text: 'Walk into it to start a battle. Good luck!' },
            { speaker: 'Mira', text: 'Use the joystick to move. Tap to begin!' }
        ];

        // DOM Elements
        const dialogScene = document.getElementById('dialog-scene');
        const explorationScene = document.getElementById('exploration-scene');
        const combatScene = document.getElementById('combat-scene');
        const dialogSpeaker = document.getElementById('dialog-speaker');
        const dialogText = document.getElementById('dialog-text');
        const playerEl = document.getElementById('player');
        const enemyMap = document.getElementById('enemy-map');
        const joystickArea = document.getElementById('joystick-area');
        const joystickKnob = document.getElementById('joystick-knob');
        const world = document.getElementById('world');
        const sceneLabel = document.getElementById('scene-label');

        // Combat elements
        const combatEnemy = document.getElementById('combat-enemy');
        const enemyHealth = document.getElementById('enemy-health');
        const enemyHealthLabel = document.getElementById('enemy-health-label');
        const playerHealth = document.getElementById('player-health');
        const playerHealthLabel = document.getElementById('player-health-label');
        const playerHpText = document.getElementById('player-hp-text');
        const combatLog = document.getElementById('combat-log');
        const attackBtn = document.getElementById('attack-btn');
        const defendBtn = document.getElementById('defend-btn');
        const combatResult = document.getElementById('combat-result');
        const resultText = document.getElementById('result-text');
        const continueBtn = document.getElementById('continue-btn');

        // Initialize grass tiles
        function initWorld() {
            world.innerHTML = '';
            const cols = Math.ceil(window.innerWidth / 40) + 2;
            const rows = Math.ceil(window.innerHeight / 40) + 2;

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'grass-tile';
                    tile.style.left = (x * 40) + 'px';
                    tile.style.top = (y * 40) + 'px';
                    const shade = Math.random() * 20 - 10;
                    tile.style.background = `rgb(${58 + shade}, ${125 + shade}, ${50 + shade})`;
                    world.appendChild(tile);
                }
            }

            // Center player
            game.player.x = window.innerWidth / 2 - 20;
            game.player.y = window.innerHeight / 2 - 30;
            updatePlayerPosition();

            // Position enemy
            if (game.enemy.alive) {
                game.enemy.x = window.innerWidth / 2 + 80;
                game.enemy.y = window.innerHeight / 3;
                updateEnemyPosition();
                enemyMap.style.display = 'block';
            }
        }

        function updatePlayerPosition() {
            playerEl.style.left = game.player.x + 'px';
            playerEl.style.top = game.player.y + 'px';
        }

        function updateEnemyPosition() {
            enemyMap.style.left = game.enemy.x + 'px';
            enemyMap.style.top = game.enemy.y + 'px';
        }

        // Collision detection
        function checkCollision() {
            if (!game.enemy.alive) return false;

            const px = game.player.x + 20;
            const py = game.player.y + 30;
            const ex = game.enemy.x + 25;
            const ey = game.enemy.y + 25;

            const dist = Math.sqrt((px - ex) ** 2 + (py - ey) ** 2);
            return dist < 50;
        }

        // Dialog System
        function advanceDialog() {
            game.dialogIndex++;

            if (game.dialogIndex >= dialogScript.length) {
                switchToExploration();
                return;
            }

            const line = dialogScript[game.dialogIndex];
            dialogSpeaker.textContent = line.speaker;
            dialogText.textContent = line.text;
            dialogSpeaker.style.color = line.speaker === 'Ley' ? '#4a9fff' : '#f472b6';
        }

        function switchToExploration() {
            game.currentScene = 'exploration';
            dialogScene.style.display = 'none';
            explorationScene.style.display = 'block';
            combatScene.style.display = 'none';
            sceneLabel.textContent = 'Exploration Mode';
            initWorld();
        }

        // Combat System
        function startCombat() {
            game.currentScene = 'combat';
            explorationScene.style.display = 'none';
            combatScene.style.display = 'block';
            sceneLabel.textContent = 'Combat!';

            game.combatActive = true;
            game.combatTurn = 'player';
            game.player.defending = false;

            // Reset enemy HP for this fight
            game.enemy.hp = game.enemy.maxHp;

            updateHealthBars();
            combatLog.textContent = 'A wild Slime appears!';
            combatResult.style.display = 'none';

            attackBtn.disabled = false;
            defendBtn.disabled = false;
        }

        function updateHealthBars() {
            const enemyPercent = (game.enemy.hp / game.enemy.maxHp) * 100;
            const playerPercent = (game.player.hp / game.player.maxHp) * 100;

            enemyHealth.style.width = enemyPercent + '%';
            enemyHealthLabel.textContent = `${game.enemy.hp} / ${game.enemy.maxHp}`;

            playerHealth.style.width = playerPercent + '%';
            playerHealthLabel.textContent = `${game.player.hp} / ${game.player.maxHp}`;
            playerHpText.textContent = `HP: ${game.player.hp} / ${game.player.maxHp}`;
        }

        function playerAttack() {
            if (!game.combatActive || game.combatTurn !== 'player') return;

            attackBtn.disabled = true;
            defendBtn.disabled = true;
            game.player.defending = false;

            // Calculate damage
            const damage = Math.floor(game.player.attack + Math.random() * 5);
            game.enemy.hp = Math.max(0, game.enemy.hp - damage);

            combatLog.textContent = `Ley attacks for ${damage} damage!`;
            combatEnemy.classList.add('damage-flash');
            setTimeout(() => combatEnemy.classList.remove('damage-flash'), 300);

            updateHealthBars();

            if (game.enemy.hp <= 0) {
                endCombat(true);
            } else {
                setTimeout(enemyTurn, 1000);
            }
        }

        function playerDefend() {
            if (!game.combatActive || game.combatTurn !== 'player') return;

            attackBtn.disabled = true;
            defendBtn.disabled = true;
            game.player.defending = true;

            combatLog.textContent = 'Ley takes a defensive stance!';

            setTimeout(enemyTurn, 1000);
        }

        function enemyTurn() {
            game.combatTurn = 'enemy';

            // Calculate damage (reduced if defending)
            let damage = Math.floor(game.enemy.attack + Math.random() * 4);
            if (game.player.defending) {
                damage = Math.floor(damage * 0.4);
                combatLog.textContent = `Slime attacks! Blocked! Only ${damage} damage!`;
            } else {
                combatLog.textContent = `Slime attacks for ${damage} damage!`;
            }

            game.player.hp = Math.max(0, game.player.hp - damage);
            playerEl.classList.add('damage-flash');
            setTimeout(() => playerEl.classList.remove('damage-flash'), 300);

            updateHealthBars();

            if (game.player.hp <= 0) {
                endCombat(false);
            } else {
                setTimeout(() => {
                    game.combatTurn = 'player';
                    game.player.defending = false;
                    attackBtn.disabled = false;
                    defendBtn.disabled = false;
                    combatLog.textContent = 'Your turn!';
                }, 1000);
            }
        }

        function endCombat(victory) {
            game.combatActive = false;
            attackBtn.disabled = true;
            defendBtn.disabled = true;

            setTimeout(() => {
                combatResult.style.display = 'flex';
                if (victory) {
                    resultText.textContent = 'VICTORY!';
                    resultText.className = 'victory';
                    game.enemy.alive = false;
                } else {
                    resultText.textContent = 'DEFEAT';
                    resultText.className = 'defeat';
                    // Restore player HP for retry
                    game.player.hp = game.player.maxHp;
                    game.enemy.alive = true;
                }
            }, 500);
        }

        function returnToExploration() {
            combatResult.style.display = 'none';
            switchToExploration();

            if (!game.enemy.alive) {
                enemyMap.style.display = 'none';
            }
        }

        // Joystick Controls
        function handleJoystickStart(e) {
            e.preventDefault();
            game.joystick.active = true;
            handleJoystickMove(e);
        }

        function handleJoystickMove(e) {
            if (!game.joystick.active) return;
            e.preventDefault();

            const rect = joystickArea.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            let dx = clientX - centerX;
            let dy = clientY - centerY;

            const maxDist = 35;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            joystickKnob.style.left = `calc(50% + ${dx}px)`;
            joystickKnob.style.top = `calc(50% + ${dy}px)`;

            game.joystick.dx = dx / maxDist;
            game.joystick.dy = dy / maxDist;
        }

        function handleJoystickEnd(e) {
            e.preventDefault();
            game.joystick.active = false;
            game.joystick.dx = 0;
            game.joystick.dy = 0;
            joystickKnob.style.left = '50%';
            joystickKnob.style.top = '50%';
        }

        // Game Loop
        function gameLoop() {
            if (game.currentScene === 'exploration' && game.joystick.active) {
                const speed = 5;
                game.player.x += game.joystick.dx * speed;
                game.player.y += game.joystick.dy * speed;

                game.player.x = Math.max(0, Math.min(window.innerWidth - 40, game.player.x));
                game.player.y = Math.max(0, Math.min(window.innerHeight - 60, game.player.y));

                updatePlayerPosition();

                // Check for enemy collision
                if (checkCollision()) {
                    game.joystick.active = false;
                    startCombat();
                }
            }
            requestAnimationFrame(gameLoop);
        }

        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            sceneLabel.textContent = 'Dialog Scene';

            // Dialog tap handler
            dialogScene.addEventListener('click', advanceDialog);
            dialogScene.addEventListener('touchend', (e) => {
                e.preventDefault();
                advanceDialog();
            });

            // Joystick handlers
            joystickArea.addEventListener('touchstart', handleJoystickStart, { passive: false });
            joystickArea.addEventListener('touchmove', handleJoystickMove, { passive: false });
            joystickArea.addEventListener('touchend', handleJoystickEnd, { passive: false });

            // Mouse fallback
            joystickArea.addEventListener('mousedown', handleJoystickStart);
            document.addEventListener('mousemove', handleJoystickMove);
            document.addEventListener('mouseup', handleJoystickEnd);

            // Combat buttons
            attackBtn.addEventListener('click', playerAttack);
            attackBtn.addEventListener('touchend', (e) => { e.preventDefault(); playerAttack(); });

            defendBtn.addEventListener('click', playerDefend);
            defendBtn.addEventListener('touchend', (e) => { e.preventDefault(); playerDefend(); });

            continueBtn.addEventListener('click', returnToExploration);
            continueBtn.addEventListener('touchend', (e) => { e.preventDefault(); returnToExploration(); });

            // Start game loop
            gameLoop();
        });
    </script>
</body>
</html>

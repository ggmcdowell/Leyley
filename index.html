<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>The Loom of Ashveld</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }
        body {
            background-color: #1a1a2e;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        #game {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Dialog Scene */
        #dialog-scene {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #2d132c 0%, #1a1a2e 100%);
            display: none;
        }
        #dialog-scene.active {
            display: block;
        }
        .dialog-sprite {
            position: absolute;
            bottom: 180px;
            width: 70px;
            height: 100px;
            border-radius: 8px;
        }
        #sprite-left {
            left: 10%;
            background: linear-gradient(to bottom, #4a9fff 0%, #2563eb 100%);
            border: 3px solid #1d4ed8;
        }
        #sprite-right {
            right: 10%;
            background: linear-gradient(to bottom, #22c55e 0%, #15803d 100%);
            border: 3px solid #14532d;
        }
        .dialog-sprite-face {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
        }
        .dialog-sprite-eyes {
            position: absolute;
            top: 12px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .dialog-sprite-eye {
            width: 6px;
            height: 6px;
            background: #333;
            border-radius: 50%;
        }
        .dialog-sprite-mouth {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 5px;
            background: #333;
            border-radius: 0 0 10px 10px;
        }
        .dialog-sprite-label {
            position: absolute;
            bottom: -22px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
        }
        #dialog-box {
            position: absolute;
            bottom: 20px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #4a3b6b;
            border-radius: 12px;
            padding: 15px;
            min-height: 120px;
        }
        #dialog-speaker {
            color: #a78bfa;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }
        #dialog-text {
            color: #fff;
            font-size: 15px;
            line-height: 1.4;
        }
        #dialog-continue {
            position: absolute;
            bottom: 10px;
            right: 15px;
            color: #666;
            font-size: 11px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Exploration Scene */
        #exploration-scene {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #2d3a27;
            display: none;
        }
        #world {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .grass-tile {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #3a5032;
            border: 1px solid #2d3a27;
        }

        /* Party HUD */
        #party-hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            padding: 8px;
            z-index: 150;
        }
        #hud-top-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        #hud-party-level {
            color: #fbbf24;
            font-weight: bold;
            font-size: 13px;
        }
        #hud-lp {
            color: #67e8f9;
            font-size: 13px;
            font-weight: bold;
        }
        #hud-gold {
            color: #fbbf24;
            font-size: 12px;
        }
        #party-mini-bars {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .mini-char {
            flex: 1;
            min-width: 70px;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            padding: 4px;
        }
        .mini-char-name {
            font-size: 10px;
            color: #a78bfa;
            font-weight: bold;
            margin-bottom: 2px;
        }
        .mini-hp-bar {
            height: 6px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
        }
        .mini-hp-fill {
            height: 100%;
            background: linear-gradient(to right, #22c55e, #4ade80);
            transition: width 0.3s;
        }

        #player {
            position: absolute;
            width: 36px;
            height: 54px;
            background: linear-gradient(to bottom, #4a9fff 0%, #2563eb 100%);
            border: 2px solid #1d4ed8;
            border-radius: 6px;
            z-index: 100;
            transition: left 0.05s, top 0.05s;
        }
        #player .sprite-face {
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 26px;
            height: 26px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
        }
        #player .sprite-eyes {
            position: absolute;
            top: 7px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 6px;
        }
        #player .sprite-eye {
            width: 4px;
            height: 4px;
            background: #333;
            border-radius: 50%;
        }
        #player .sprite-mouth {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 3px;
            background: #333;
            border-radius: 0 0 6px 6px;
        }

        /* Enemy on map */
        .enemy-map {
            position: absolute;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            z-index: 99;
            cursor: pointer;
        }
        .enemy-map .enemy-face {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 28px;
            height: 18px;
        }
        .enemy-map .enemy-eyes {
            display: flex;
            justify-content: space-between;
            padding: 0 2px;
        }
        .enemy-map .enemy-eye {
            width: 7px;
            height: 7px;
            background: #fff;
            border-radius: 50%;
        }
        .enemy-map .enemy-mouth {
            width: 16px;
            height: 6px;
            background: #000;
            margin: 3px auto 0;
            border-radius: 0 0 8px 8px;
        }
        .enemy-leyrat {
            background: linear-gradient(to bottom, #6b7280 0%, #4b5563 100%);
            border: 3px solid #374151;
        }
        .enemy-cordwork {
            background: linear-gradient(to bottom, #a855f7 0%, #7c3aed 100%);
            border: 3px solid #5b21b6;
        }
        .enemy-scout {
            background: linear-gradient(to bottom, #ef4444 0%, #b91c1c 100%);
            border: 3px solid #7f1d1d;
        }
        .enemy-wisp {
            background: linear-gradient(to bottom, #22d3ee 0%, #0891b2 100%);
            border: 3px solid #155e75;
        }
        .enemy-warden {
            background: linear-gradient(to bottom, #dc2626 0%, #991b1b 100%);
            border: 3px solid #7f1d1d;
            width: 55px;
            height: 55px;
        }
        .combat-enemy.enemy-warden {
            width: 90px;
            height: 90px;
        }
        /* Act 2 Enemies */
        .enemy-ironbound {
            background: linear-gradient(to bottom, #78716c 0%, #57534e 100%);
            border: 3px solid #44403c;
            width: 50px;
            height: 50px;
        }
        .combat-enemy.enemy-ironbound {
            width: 80px;
            height: 80px;
        }
        .enemy-remnant {
            background: linear-gradient(to bottom, #8b5cf6 0%, #6d28d9 100%);
            border: 3px solid #4c1d95;
        }
        .enemy-horror {
            background: linear-gradient(to bottom, #84cc16 0%, #65a30d 100%);
            border: 3px solid #4d7c0f;
            width: 50px;
            height: 50px;
        }
        .combat-enemy.enemy-horror {
            width: 85px;
            height: 85px;
        }
        .enemy-convergence {
            background: linear-gradient(to bottom, #06b6d4 0%, #0891b2 100%);
            border: 3px solid #0e7490;
            width: 60px;
            height: 60px;
        }
        .combat-enemy.enemy-convergence {
            width: 100px;
            height: 100px;
        }
        /* Act 3 Final Boss */
        .enemy-assemblage {
            background: linear-gradient(135deg, #dc2626 0%, #7c3aed 50%, #0891b2 100%);
            border: 4px solid #fbbf24;
            width: 70px;
            height: 70px;
            animation: assemblage-pulse 2s ease-in-out infinite;
        }
        .combat-enemy.enemy-assemblage {
            width: 120px;
            height: 120px;
        }
        @keyframes assemblage-pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.5); }
            50% { box-shadow: 0 0 40px rgba(251, 191, 36, 0.8); }
        }

        /* Virtual Joystick */
        #joystick-area {
            position: absolute;
            bottom: 25px;
            left: 25px;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            z-index: 200;
        }
        #joystick-knob {
            position: absolute;
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 201;
        }

        /* Combat Scene */
        #combat-scene {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #1a1a2e 0%, #0f0f1a 100%);
            display: none;
        }
        #combat-background {
            position: absolute;
            width: 100%;
            height: 35%;
            top: 0;
            background: linear-gradient(to bottom, #2d1b4e 0%, #1a1a2e 100%);
            border-bottom: 2px solid #4a3b6b;
        }

        /* Turn Order Queue */
        #turn-order {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            display: flex;
            gap: 4px;
            z-index: 300;
        }
        .turn-icon {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: #fff;
            border: 2px solid transparent;
            opacity: 0.7;
        }
        .turn-icon.active {
            opacity: 1;
            border-color: #fbbf24;
            box-shadow: 0 0 8px #fbbf24;
        }
        .turn-icon.party {
            background: linear-gradient(to bottom, #3b82f6, #1d4ed8);
        }
        .turn-icon.enemy {
            background: linear-gradient(to bottom, #ef4444, #b91c1c);
        }

        /* Enemy Display */
        #enemies-area {
            position: absolute;
            top: 50px;
            left: 0;
            right: 0;
            height: calc(35% - 50px);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            padding: 10px;
        }
        .combat-enemy {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            position: relative;
            transition: transform 0.2s, opacity 0.3s;
        }
        .combat-enemy.targeted {
            transform: scale(1.1);
            box-shadow: 0 0 15px #fbbf24;
        }
        .combat-enemy.dead {
            opacity: 0.3;
            filter: grayscale(1);
        }
        .combat-enemy .enemy-face {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .enemy-hp-mini {
            position: absolute;
            bottom: -8px;
            left: 5px;
            right: 5px;
            height: 5px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
        }
        .enemy-hp-mini-fill {
            height: 100%;
            background: #ef4444;
            transition: width 0.3s;
        }
        .enemy-name-label {
            position: absolute;
            top: -16px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 9px;
            white-space: nowrap;
        }

        /* Combat Log */
        #combat-log {
            position: absolute;
            top: 36%;
            left: 10px;
            right: 10px;
            text-align: center;
            color: #fbbf24;
            font-size: 13px;
            font-weight: bold;
            text-shadow: 1px 1px 3px #000;
            min-height: 20px;
        }

        /* LP Bar */
        #lp-bar-container {
            position: absolute;
            top: calc(36% + 24px);
            left: 15%;
            right: 15%;
            height: 18px;
            background: #222;
            border-radius: 9px;
            border: 2px solid #0891b2;
            overflow: hidden;
        }
        #lp-bar {
            height: 100%;
            background: linear-gradient(to right, #06b6d4, #22d3ee);
            transition: width 0.3s;
        }
        #lp-label {
            position: absolute;
            top: calc(36% + 24px);
            left: 15%;
            right: 15%;
            height: 18px;
            line-height: 18px;
            text-align: center;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
            z-index: 10;
        }

        /* Party Display */
        #party-area {
            position: absolute;
            top: calc(36% + 50px);
            left: 0;
            right: 0;
            bottom: 140px;
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 8px;
            overflow-x: auto;
        }
        .party-member {
            flex: 0 0 auto;
            width: 75px;
            background: rgba(0,0,0,0.6);
            border-radius: 8px;
            padding: 6px;
            border: 2px solid #333;
            transition: border-color 0.2s, transform 0.2s;
        }
        .party-member.active-turn {
            border-color: #fbbf24;
            transform: scale(1.05);
        }
        .party-member.dead {
            opacity: 0.4;
            filter: grayscale(0.5);
        }
        .party-member.targeted {
            border-color: #ef4444;
            box-shadow: 0 0 10px #ef4444;
        }
        .pm-sprite {
            width: 40px;
            height: 50px;
            margin: 0 auto 4px;
            border-radius: 6px;
            position: relative;
        }
        .pm-sprite.silas { background: linear-gradient(to bottom, #4a9fff, #2563eb); border: 2px solid #1d4ed8; }
        .pm-sprite.corra { background: linear-gradient(to bottom, #a78bfa, #7c3aed); border: 2px solid #5b21b6; }
        .pm-sprite.vesk { background: linear-gradient(to bottom, #f97316, #ea580c); border: 2px solid #c2410c; }
        .pm-sprite.echo { background: linear-gradient(to bottom, #22d3ee, #06b6d4); border: 2px solid #0891b2; }
        .pm-face {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 24px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
        }
        .pm-name {
            text-align: center;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            margin-bottom: 3px;
        }
        .pm-hp-bar {
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 2px;
        }
        .pm-hp-fill {
            height: 100%;
            background: linear-gradient(to right, #22c55e, #4ade80);
            transition: width 0.3s;
        }
        .pm-hp-text {
            text-align: center;
            color: #22c55e;
            font-size: 9px;
        }
        .pm-status {
            display: flex;
            gap: 2px;
            justify-content: center;
            margin-top: 3px;
            min-height: 14px;
        }
        .status-icon {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            font-size: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Combat UI */
        #combat-ui {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 140px;
            background: rgba(0, 0, 0, 0.95);
            border-top: 2px solid #4a3b6b;
            padding: 8px;
        }
        #action-label {
            text-align: center;
            color: #a78bfa;
            font-size: 12px;
            margin-bottom: 6px;
        }
        #combat-actions {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .combat-btn {
            padding: 10px 14px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.1s;
            min-width: 70px;
        }
        .combat-btn:active {
            transform: scale(0.95);
        }
        .combat-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        #strike-btn {
            background: linear-gradient(to bottom, #ef4444, #b91c1c);
            color: #fff;
            border: 2px solid #7f1d1d;
        }
        #guard-btn {
            background: linear-gradient(to bottom, #3b82f6, #1d4ed8);
            color: #fff;
            border: 2px solid #1e40af;
        }
        #skill-btn {
            background: linear-gradient(to bottom, #a855f7, #7c3aed);
            color: #fff;
            border: 2px solid #5b21b6;
        }
        .skill-cost {
            font-size: 9px;
            display: block;
            opacity: 0.8;
        }

        /* Target Selection */
        #target-selection {
            display: none;
            text-align: center;
        }
        #target-selection.active {
            display: block;
        }
        #target-label {
            color: #fbbf24;
            font-size: 12px;
            margin-bottom: 6px;
        }
        #target-buttons {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .target-btn {
            padding: 8px 12px;
            font-size: 11px;
            background: linear-gradient(to bottom, #374151, #1f2937);
            color: #fff;
            border: 2px solid #4b5563;
            border-radius: 6px;
            cursor: pointer;
        }
        .target-btn:hover {
            border-color: #fbbf24;
        }
        #cancel-target-btn {
            background: linear-gradient(to bottom, #6b7280, #4b5563);
            border-color: #374151;
        }

        /* Skill Selection */
        #skill-selection {
            display: none;
            text-align: center;
        }
        #skill-selection.active {
            display: block;
        }
        #skill-label {
            color: #a855f7;
            font-size: 12px;
            margin-bottom: 6px;
        }
        #skill-buttons {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .skill-select-btn {
            padding: 8px 12px;
            font-size: 11px;
            background: linear-gradient(to bottom, #7c3aed, #5b21b6);
            color: #fff;
            border: 2px solid #4c1d95;
            border-radius: 6px;
            cursor: pointer;
        }
        .skill-select-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .skill-select-btn .skill-lp {
            font-size: 9px;
            opacity: 0.8;
        }

        /* Combat Result Overlay */
        #combat-result {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 400;
        }
        #result-text {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        #result-text.victory { color: #22c55e; }
        #result-text.defeat { color: #ef4444; }
        #rewards-text {
            color: #fbbf24;
            font-size: 16px;
            margin-bottom: 8px;
        }
        #xp-gain {
            color: #a78bfa;
            font-size: 14px;
            margin-bottom: 20px;
        }
        #continue-btn {
            padding: 12px 35px;
            font-size: 16px;
            background: linear-gradient(to bottom, #4a9fff, #2563eb);
            color: #fff;
            border: 2px solid #1d4ed8;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Level Up Overlay */
        #levelup-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 500;
        }
        #levelup-overlay.active {
            display: flex;
        }
        #levelup-title {
            color: #fbbf24;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 0 15px #fbbf24;
        }
        #levelup-char {
            color: #a78bfa;
            font-size: 18px;
            margin-bottom: 10px;
        }
        #levelup-stats {
            color: #fff;
            font-size: 13px;
            text-align: center;
            margin-bottom: 15px;
        }
        #levelup-stats div {
            margin: 4px 0;
        }
        #levelup-btn {
            padding: 12px 35px;
            font-size: 16px;
            background: linear-gradient(to bottom, #fbbf24, #d97706);
            color: #000;
            border: 2px solid #92400e;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Damage/Heal Numbers */
        .floating-number {
            position: absolute;
            font-weight: bold;
            font-size: 16px;
            text-shadow: 2px 2px 3px #000;
            animation: floatUp 1s ease-out forwards;
            pointer-events: none;
            z-index: 1000;
        }
        .floating-number.damage { color: #ef4444; }
        .floating-number.heal { color: #22c55e; }
        .floating-number.crit { color: #fbbf24; font-size: 20px; }
        .floating-number.lp { color: #22d3ee; }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-40px); }
        }

        /* Damage Flash */
        .damage-flash {
            animation: damageFlash 0.3s ease;
        }
        @keyframes damageFlash {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(2) saturate(0); }
        }

        .element-vital { border-color: #22c55e !important; }
        .element-thermal { border-color: #f97316 !important; }
        .element-aetheric { border-color: #a855f7 !important; }

        /* Player Choice UI */
        #choice-container {
            position: absolute;
            bottom: 20px;
            left: 10px;
            right: 10px;
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        #choice-container.active {
            display: flex;
        }
        .choice-btn {
            padding: 15px 20px;
            font-size: 14px;
            background: linear-gradient(to bottom, #374151, #1f2937);
            color: #fff;
            border: 2px solid #4b5563;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: border-color 0.2s, transform 0.1s;
        }
        .choice-btn:hover, .choice-btn:focus {
            border-color: #fbbf24;
            transform: scale(1.02);
        }
        .choice-btn:active {
            transform: scale(0.98);
        }
        .choice-title {
            font-weight: bold;
            color: #fbbf24;
            margin-bottom: 4px;
        }
        .choice-desc {
            font-size: 12px;
            color: #9ca3af;
        }

        /* Scene location header */
        #scene-location {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 20px;

        }

        // ==================== STORY SYSTEM ====================
        function getScene(sceneId) {
            // Handle cross-act references
            if (sceneId.startsWith('act1_')) {
                return STORY.act1[sceneId.replace('act1_', '')];
            }
            if (sceneId.startsWith('act2_')) {
                game.story.currentAct = 'act2';
                return STORY.act2[sceneId.replace('act2_', '')];
            }
            if (sceneId.startsWith('act3_')) {
                game.story.currentAct = 'act3';
                return STORY.act3[sceneId.replace('act3_', '')];
            }
            // Check current act first
            const act = game.story.currentAct;
            if (STORY[act] && STORY[act][sceneId]) {
                return STORY[act][sceneId];
            }
            // Check act3 for scenes
            if (STORY.act3 && STORY.act3[sceneId]) {
                game.story.currentAct = 'act3';
                return STORY.act3[sceneId];
            }
            // Check act2 for scenes
            if (STORY.act2 && STORY.act2[sceneId]) {
                game.story.currentAct = 'act2';
                return STORY.act2[sceneId];
            }
            // Check act1 for all other scenes
            if (STORY.act1[sceneId]) {
                game.story.currentAct = 'act1';
                return STORY.act1[sceneId];
            }
            return null;
        }

        function addEchoToParty() {

            if (game.party.some(c => c.id === 'echo')) return;

                spd: template.baseStats.spd + (template.growth.spd * (game.partyLevel - 1)),

        function playScene(sceneId) {
            const scene = getScene(sceneId);
            if (!scene) {
                console.error('Scene not found:', sceneId);
                return;

            game.story.currentScene = sceneId;

            // Update location display
            const locationEl = document.getElementById('scene-location');
            if (scene.location) {
                locationEl.textContent = scene.location;
                locationEl.classList.add('active');
            } else {
                locationEl.classList.remove('active');
            }

            // Play dialog, then handle combat/choice/next
            showStoryDialog(scene.dialog, () => {
                // Handle onComplete callbacks
                if (scene.onComplete === 'addEcho') {
                    addEchoToParty();
                }

                if (scene.combat) {
                    startStoryCombat(scene.combat, sceneId);
                } else if (scene.choice) {
                    showChoice(scene.choice, sceneId);
                } else if (scene.next) {
                    if (scene.next === 'end') {
                        // End of current content
                        switchToExploration();
                    } else {
                        playScene(scene.next);
                    }
                }
            });
        }

        function selectChoice(option, currentSceneId) {
            // Apply choice consequences
            if (option.flag) {
                game.story.flags[option.flag] = option.value;
            }

            if (option.lpCost) {
                game.lp = Math.max(0, game.lp - option.lpCost);
            }

            if (option.relationship) {
                for (const [char, mod] of Object.entries(option.relationship)) {
                    const key = char + 'Relationship';
                    if (game.story.flags[key] !== undefined) {
                        game.story.flags[key] += mod;
                    }

            }

            // Hide choice UI
            document.getElementById('choice-container').classList.remove('active');

            // Continue to next scene
            if (option.next) {
                playScene(option.next);
            }
